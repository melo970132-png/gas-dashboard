<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GAS 戰情監控中心 v5.2.0</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/lucide/0.263.0/lucide.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Noto+Sans+TC:wght@400;700;900&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet">
    <style>
        :root { --bg-light: #f8fafc; }
        body { font-family: 'Inter', 'Noto Sans TC', sans-serif; background-color: var(--bg-light); color: #1e293b; min-height: 100vh; }
        
        /* ✨ 玻璃美學與科技感優化 */
        .glass-card-ar { 
            background: rgba(224, 242, 254, 0.7); 
            backdrop-filter: blur(10px);
            border: 1px solid rgba(186, 230, 253, 0.8);
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }
        .glass-card-he { 
            background: rgba(245, 243, 255, 0.7); 
            backdrop-filter: blur(10px);
            border: 1px solid rgba(221, 214, 254, 0.8);
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }
        
        /* 手機版優化基礎 */
        @media (max-width: 640px) {
            .text-adaptive-title { font-size: 2.5rem !important; }
            .card-grid { gap: 1rem !important; }
            .monitor-card { height: auto !important; min-height: 280px; }
        }

        .nav-active { background: #2563eb !important; color: white !important; }
        .page-content { display: none; animation: fadeIn 0.4s ease-out forwards; }
        .page-active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.1); border-radius: 10px; }
    </style>
</head>
<body class="flex flex-col lg:flex-row h-screen overflow-hidden">

    <aside class="lg:w-64 w-full bg-white border-r border-slate-200 p-6 flex flex-col z-50">
        <div class="mb-10 flex flex-col items-center lg:items-start">
            <h1 class="text-2xl font-black italic tracking-tighter text-slate-900 uppercase">Gas Command</h1>
            <p class="text-[9px] text-blue-600 font-bold tracking-[0.3em] uppercase mt-1">v5.2.0 Glass Tech</p>
        </div>
        <nav class="space-y-2">
            <button onclick="switchPage('monitor')" id="nav-monitor" class="nav-active w-full flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-bold transition-all"><i data-lucide="layout-dashboard" class="w-4 h-4"></i> 即時監控</button>
            <button onclick="switchPage('schedule')" id="nav-schedule" class="w-full flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-bold text-slate-500 hover:bg-slate-100 transition-all"><i data-lucide="calendar-range" class="w-4 h-4"></i> 備刀排程</button>
            <button onclick="switchPage('analysis')" id="nav-analysis" class="w-full flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-bold text-slate-500 hover:bg-slate-100 transition-all"><i data-lucide="bar-chart-3" class="w-4 h-4"></i> 數據中心</button>
        </nav>
    </aside>

    <main class="flex-1 overflow-hidden p-4 lg:p-10">
        <section id="page-monitor" class="page-content page-active h-full flex flex-col">
            <header class="flex flex-col md:flex-row justify-between items-start md:items-end mb-8 gap-4">
                <div>
                    <h2 class="text-adaptive-title text-5xl font-black italic text-slate-900 uppercase tracking-tighter leading-none">Live Status</h2>
                    <p class="text-blue-600 text-xs font-bold tracking-widest mt-2 uppercase">高密度數據監控面板</p>
                </div>
                <div class="flex gap-1 bg-slate-200/50 p-1 rounded-xl border border-slate-200">
                    <button onclick="filterRegion('ALL')" class="reg-btn px-4 py-1.5 rounded-lg text-xs font-bold bg-blue-600 text-white shadow-sm">全域</button>
                    <button onclick="filterRegion('北區')" class="reg-btn px-4 py-1.5 rounded-lg text-xs font-bold text-slate-500">北區</button>
                    <button onclick="filterRegion('中區')" class="reg-btn px-4 py-1.5 rounded-lg text-xs font-bold text-slate-500">中區</button>
                    <button onclick="filterRegion('南區')" class="reg-btn px-4 py-1.5 rounded-lg text-xs font-bold text-slate-500">南區</button>
                </div>
            </header>
            
            <div id="monitor-grid" class="card-grid grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-6 overflow-y-auto flex-1 custom-scrollbar pb-10"></div>
        </section>

        <section id="page-analysis" class="page-content">...</section>
        <section id="page-schedule" class="page-content">...</section>
    </main>

    <div id="monitor-modal" class="fixed inset-0 z-[100] hidden flex items-center justify-center p-4 bg-slate-900/40 backdrop-blur-sm">
        <div class="bg-white/90 backdrop-blur-xl w-full max-w-4xl rounded-[2.5rem] p-8 relative border border-white shadow-2xl">
            <button onclick="closeMonitorModal()" class="absolute top-6 right-6 text-slate-400 hover:text-slate-600 transition-transform hover:rotate-90"><i data-lucide="x" class="w-8 h-8"></i></button>
            <div id="monitor-modal-content"></div>
        </div>
    </div>

    <script>
        // ... (SPREADSHEET_ID, API_KEY 等變數保持不變) ...
        const SPREADSHEET_ID = '1Vp78y7ACG9wx3RxtAwW-s4YE9l2Ml-hcUjQ2W7QLpXU';
        const API_KEY = 'AIzaSyCQzF6JI8Oa9VsiWq5Qgg56nDX6AtXk_18'; 
        const GAS_WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbyhq3KFBvN-HQzb1eeIx2Bdg_6ZyFJMr4KxJbKajzkSMxMMZNwDHI4koSALFD6wz5d6kA/exec'; 

        const USERS = ["杜孟擇", "張家榮"];
        const HOSPITALS = ["三軍總醫院", "國立臺灣大學醫學院附設醫院", "長庚醫療財團法人林口長庚紀念醫院", "國泰綜合醫院", "醫療財團法人羅許基金會羅東博愛醫院", "新竹臺大分院新竹醫院", "佛教慈濟醫療財團法人台北慈濟醫院", "基隆長庚紀念醫院", "汐止國泰綜合醫院", "新光醫療財團法人新光吳火獅紀念醫院", "佛教慈濟醫療財團法人花蓮慈濟醫院", "臺北榮總醫院", "衛生福利部雙和醫院", "天主教輔仁大學附設醫院", "新竹國泰綜合醫院", "淡水馬偕紀念醫院", "學術會"];
        
        let latestMonitorData = []; 
        let historicalRows = []; 
        let currentMonitorFilter = 'ALL';

        function safeLucide() { if (window.lucide) window.lucide.createIcons(); }

        window.onload = async () => { 
            await fetchMonitorData(); 
            await preLoadHistoricalData(); 
            safeLucide(); 
        };

        async function fetchMonitorData() {
            const url = `https://sheets.googleapis.com/v4/spreadsheets/${SPREADSHEET_ID}/values/紀錄!A2:L2000?key=${API_KEY}`;
            try {
                const res = await fetch(url); const data = await res.json();
                if (data.values) {
                    const map = new Map();
                    data.values.forEach(row => {
                        if (row[2]) map.set(row[2], {
                            gas: row[2], region: row[3], standbyDate: row[4], location: row[5], reason: row[6], pressure: parseInt(row[7]) || 0, user: row[1], time: row[0]
                        });
                    });
                    latestMonitorData = Array.from(map.values()).sort((a,b) => a.gas.localeCompare(b.gas));
                    renderMonitorCards();
                }
            } catch (e) { console.error(e); }
        }

        async function preLoadHistoricalData() {
            const url = `https://sheets.googleapis.com/v4/spreadsheets/${SPREADSHEET_ID}/values/紀錄!A2:H3000?key=${API_KEY}`;
            try {
                const response = await fetch(url);
                const result = await response.json();
                historicalRows = result.values || [];
            } catch (e) { console.error(e); }
        }

        function renderMonitorCards() {
            const grid = document.getElementById('monitor-grid');
            const filtered = currentMonitorFilter === 'ALL' ? latestMonitorData : latestMonitorData.filter(d => d.region === currentMonitorFilter);
            grid.innerHTML = filtered.map(item => {
                const isAr = item.gas.toLowerCase().startsWith('ar');
                const glassClass = isAr ? 'glass-card-ar' : 'glass-card-he';
                const isCrit = item.pressure < 3000;
                const pct = Math.min((item.pressure / 6000) * 100, 100);
                return `
                <div onclick="showMonitorDetail('${item.gas}')" class="${glassClass} monitor-card p-5 rounded-[2rem] cursor-pointer hover:scale-[1.02] transition-all relative overflow-hidden flex flex-col justify-between h-[300px]">
                    <div class="flex justify-between items-start">
                        <div class="space-y-0">
                            <h3 class="text-4xl font-black text-slate-900 italic leading-none">${item.gas}</h3>
                            <p class="text-[12px] font-black text-blue-600 uppercase tracking-tighter mt-1">${item.region} · ${item.location}</p>
                        </div>
                        <div class="text-right bg-white/40 px-3 py-2 rounded-2xl border border-white/50">
                            <p class="text-[10px] text-slate-500 font-bold uppercase leading-none">用途</p>
                            <p class="text-blue-800 font-black text-base italic leading-tight">${item.reason}</p>
                            <p class="text-[10px] text-slate-500 font-bold uppercase leading-none mt-1">備刀日期</p>
                            <p class="text-slate-800 font-black text-sm italic leading-tight">${item.standbyDate || '無'}</p>
                        </div>
                    </div>
                    
                    <div class="flex items-center gap-4">
                        <div class="flex-1">
                            <div class="flex items-baseline gap-1 leading-none mb-1">
                                <span class="text-5xl font-mono font-black text-slate-900 italic">${item.pressure.toLocaleString()}</span>
                                <span class="text-sm font-bold text-slate-400">PSI</span>
                            </div>
                            <div class="w-full h-2.5 bg-white/50 rounded-full overflow-hidden border border-white/30 shadow-inner">
                                <div class="h-full ${isCrit ? 'bg-red-500' : 'bg-blue-600'}" style="width: ${pct}%"></div>
                            </div>
                        </div>
                    </div>

                    <div class="flex justify-between items-end pt-3 border-t border-slate-900/5">
                        <div class="bg-white/30 px-3 py-1 rounded-lg">
                            <p class="text-[9px] text-slate-500 font-bold uppercase leading-none mb-0.5">填報人</p>
                            <p class="text-slate-800 font-black text-sm">${item.user}</p>
                        </div>
                        <div class="text-right">
                            <p class="text-[9px] text-slate-500 font-bold uppercase leading-none mb-0.5">填入時間</p>
                            <p class="text-slate-600 font-mono font-bold text-[11px] leading-none">${item.time}</p>
                        </div>
                    </div>
                </div>`;
            }).join('');
            safeLucide();
        }

        function showMonitorDetail(gasName) {
            const item = latestMonitorData.find(d => d.gas === gasName);
            if (!item) return;
            const history = historicalRows.filter(r => r[2] === gasName).slice(-5).reverse();
            let historyHtml = history.map(h => {
                const isLow = (parseInt(h[7]) || 0) < 3000;
                return `
                <div class="flex justify-between items-center py-3 border-b border-slate-100 last:border-0">
                    <div class="text-xs">
                        <p class="font-black text-slate-800">${h[6]} @ ${h[5]}</p>
                        <p class="text-[10px] text-slate-400 font-bold">BY: ${h[1]} · ${h[0]}</p>
                    </div>
                    <div class="text-lg font-mono font-black ${isLow ? 'text-red-500' : 'text-blue-600'} italic">${parseInt(h[7]).toLocaleString()} <span class="text-[10px]">PSI</span></div>
                </div>`;
            }).join('');

            document.getElementById('monitor-modal-content').innerHTML = `
                <div class="flex flex-col md:flex-row gap-8">
                    <div class="md:w-[30%] border-r border-slate-100 pr-6">
                        <h2 class="text-5xl font-black text-slate-900 italic leading-none mb-4">${item.gas}</h2>
                        <div class="space-y-4">
                            <div class="bg-blue-50/50 p-4 rounded-2xl border border-blue-100">
                                <p class="text-[10px] text-slate-400 font-black uppercase mb-1">當前存量</p>
                                <p class="text-4xl font-black text-slate-900 font-mono italic leading-none">${item.pressure.toLocaleString()}</p>
                            </div>
                            <div class="px-4">
                                <p class="text-[10px] text-slate-400 font-black uppercase mb-1">目前用途</p>
                                <p class="text-blue-700 font-black text-lg italic leading-none">${item.reason}</p>
                            </div>
                        </div>
                    </div>
                    <div class="flex-1">
                        <h3 class="text-xs font-black text-slate-400 uppercase mb-4 tracking-widest italic flex items-center gap-2">
                             📜 最近 5 筆歷史軌跡
                        </h3>
                        <div class="space-y-1">${historyHtml || '<p class="text-xs text-slate-300">無數據</p>'}</div>
                    </div>
                </div>
                <button onclick="closeMonitorModal()" class="w-full mt-8 py-4 bg-slate-900 text-white rounded-2xl font-black text-sm tracking-[0.4em] hover:bg-black transition-all uppercase italic">CLOSE</button>
            `;
            document.getElementById('monitor-modal').classList.remove('hidden'); safeLucide();
        }

        // --- 📊 分析頁面更新 ---
        function updateAnalysisRegion(region) {
            document.querySelectorAll('.ana-reg-btn').forEach(btn => {
                if(btn.innerText.includes(region)) btn.classList.add('ana-reg-btn-active');
                else btn.classList.remove('ana-reg-btn-active');
            });
            const hospitalCount = {};
            let arTotal = 0, arCount = 0, heTotal = 0, heCount = 0;
            historicalRows.forEach(row => {
                const time = row[0] || "", gasID = row[2] || "", reg = row[3] || "", hospital = row[5] || "", reason = row[6] || "", psi = parseInt(row[7]) || 0;
                if (reg === region) {
                    if (time.includes("2026") && hospital) hospitalCount[hospital] = (hospitalCount[hospital] || 0) + 1;
                    if (reason === "待灌氣") {
                        if (gasID.toLowerCase().startsWith("ar")) { arTotal += psi; arCount++; }
                        else if (gasID.toLowerCase().startsWith("he")) { heTotal += psi; heCount++; }
                    }
                }
            });
            const listArea = document.getElementById('ana-hospital-list');
            const sorted = Object.entries(hospitalCount).sort((a,b) => b[1] - a[1]);
            listArea.innerHTML = sorted.length > 0 ? sorted.map(([name, count]) => `
                <div class="flex justify-between items-center bg-slate-50 p-4 rounded-xl border border-slate-100"><span class="font-bold text-slate-700">${name}</span><span class="bg-blue-600 text-white px-4 py-1 rounded-full text-xs font-black italic leading-none">${count} VISITS</span></div>
            `).join('') : '<p class="text-slate-400 text-center py-10 leading-none">2026 尚無紀錄</p>';
            document.getElementById('ana-ar-psi').innerText = arCount > 0 ? Math.round(arTotal/arCount) : "--";
            document.getElementById('ana-he-psi').innerText = heCount > 0 ? Math.round(heTotal/heCount) : "--";
        }

        // --- 📡 其餘功能保持不變 ---
        function switchPage(p) { document.querySelectorAll('.page-content').forEach(el => el.classList.remove('page-active')); document.getElementById('page-'+p).classList.add('page-active'); document.querySelectorAll('nav button').forEach(b => b.classList.remove('nav-active')); document.getElementById('nav-'+p).classList.add('nav-active'); safeLucide(); }
        function filterRegion(r) { currentMonitorFilter = r; document.querySelectorAll('.reg-btn').forEach(b => b.classList.toggle('bg-blue-600', b.innerText.includes(r) || (r==='ALL' && b.innerText==='全域'))); document.querySelectorAll('.reg-btn').forEach(b => b.classList.toggle('text-white', b.classList.contains('bg-blue-600'))); renderMonitorCards(); }
        function closeMonitorModal() { document.getElementById('monitor-modal').classList.add('hidden'); }
        async function loadSchedulesFromCloud() {
            const url = `https://sheets.googleapis.com/v4/spreadsheets/${SPREADSHEET_ID}/values/備刀紀錄!A2:J2000?key=${API_KEY}`;
            try { const res = await fetch(url); const data = await res.json(); if (data.values) { localSchedules = data.values.map(r => ({ id: parseInt(r[0]), date: r[1], weekday: r[2], hospital: r[3], user: r[4], cases: r[5], he: r[6], ar1: r[7], ar2: r[8], status: r[9] })); renderScheduleList(); } } catch (e) { console.error(e); }
        }
        function renderScheduleList() {
            const grid = document.getElementById('scheduleGrid'); const now = new Date(); now.setHours(0,0,0,0);
            const sorted = [...localSchedules].sort((a, b) => new Date(a.date) - new Date(b.date));
            const alerts = sorted.filter(s => new Date(s.date) < now && s.status === 'pending');
            const active = sorted.filter(s => new Date(s.date) >= now && s.status === 'pending');
            const archive = sorted.filter(s => (s.status === 'done' || s.status === 'cancelled') && (new Date() - new Date(s.date)) / (1000*60*60*24) <= 7);
            let html = '';
            if(alerts.length > 0) html += `<div class="mb-4"><h4 class="text-sm font-black text-amber-600 uppercase mb-3 leading-none tracking-widest">⚠️ 逾期未處理</h4>` + alerts.map(i => getItemHtml(i, 'status-alert')).join('') + `</div>`;
            html += `<div class="mb-4"><h4 class="text-sm font-black text-slate-400 uppercase mb-3 leading-none tracking-widest">📅 預定備刀</h4>` + (active.length > 0 ? active.map(i => getItemHtml(i)).join('') : `<div class="text-base text-slate-300 italic py-10 text-center">目前無任務</div>`) + `</div>`;
            if(archive.length > 0) html += `<div class="mt-12 border-t border-slate-200 pt-6"><button onclick="toggleArchive()" class="w-full py-4 bg-slate-100 rounded-2xl text-sm font-black text-slate-500 uppercase flex justify-between px-6"><span>顯示 7 天內歷史紀錄</span><i data-lucide="chevron-down"></i></button><div id="archiveContent" class="hidden space-y-4 mt-6">` + archive.map(i => getItemHtml(i, i.status === 'done' ? 'status-done' : 'status-cancelled')).join('') + `</div></div>`;
            grid.innerHTML = html; safeLucide();
        }
        function getItemHtml(item, customClass = '') {
            let badge = item.status === 'done' ? `<span class="bg-green-100 text-green-600 px-3 py-1 rounded-lg text-xs font-black italic leading-none">DONE</span>` : (item.status === 'cancelled' ? `<span class="bg-red-100 text-red-600 px-3 py-1 rounded-lg text-xs font-black italic leading-none">CANCELLED</span>` : '');
            return `<div onclick="editSchedule(${item.id})" class="item-row bg-white p-6 rounded-[2rem] border border-slate-100 flex flex-col md:flex-row items-center gap-6 cursor-pointer shadow-sm ${customClass} transition-all"><div class="flex flex-col items-center justify-center min-w-[100px] border-r border-slate-100 pr-6"><span class="text-blue-500 font-black text-xs uppercase mb-2 leading-none">${item.weekday}</span><span class="text-slate-900 font-mono font-black text-2xl leading-none">${item.date.slice(5)}</span></div><div class="flex-1 text-center md:text-left"><div class="flex items-center gap-3 justify-center md:justify-start mb-2"><h4 class="text-2xl font-black text-slate-800 uppercase italic leading-none">${item.hospital}</h4>${badge}</div><div class="text-xs font-bold text-slate-400 font-mono">User: ${item.user} | Cases: ${item.cases}</div></div><div class="flex gap-3"><div class="bg-blue-50 border border-blue-100 px-6 py-3 rounded-2xl text-center"><p class="text-[10px] font-black text-blue-500 italic mb-1 leading-none">HE</p><p class="text-2xl font-black text-slate-800 font-mono leading-none">${item.he}</p></div><div class="bg-slate-50 border border-slate-100 px-6 py-3 rounded-2xl text-center"><p class="text-[10px] font-black text-slate-500 italic mb-1 leading-none">AR1</p><p class="text-2xl font-black text-slate-800 font-mono leading-none">${item.ar1}</p></div></div></div>`;
        }
        function initForms() {
            const uSel = document.getElementById('userName'); const hSel = document.getElementById('hospitalName'); const gSels = document.querySelectorAll('.gas-sel');
            USERS.forEach(u => uSel.add(new Option(u, u))); HOSPITALS.forEach(h => hSel.add(new Option(h, h)));
            for(let v=6000; v>=2500; v-=100) gSels.forEach(s => s.add(new Option(v+' PSI', v)));
            document.getElementById('surgeryDate').addEventListener('input', (e) => { const days = ['週日','週一','週二','週三','週四','週五','週六']; document.getElementById('weekdayDisplay').innerText = days[new Date(e.target.value).getDay()] || '--'; });
            document.getElementById('surgeryForm').addEventListener('submit', async function(e) { e.preventDefault(); const btn = document.getElementById('submitBtn'); btn.disabled = true; btn.innerText = "SYNCING..."; const editId = document.getElementById('editId').value; const data = { id: editId ? parseInt(editId) : Date.now(), user: document.getElementById('userName').value, date: document.getElementById('surgeryDate').value, weekday: document.getElementById('weekdayDisplay').innerText, hospital: document.getElementById('hospitalName').value, cases: document.getElementById('casesCount').value, he: document.getElementById('heGas').value, ar1: document.getElementById('ar1Gas').value, ar2: document.getElementById('ar2Gas').value || '無', status: 'pending' }; const success = await saveToCloud(data); if (success) { if (editId) { const idx = localSchedules.findIndex(s => s.id === data.id); localSchedules[idx] = data; } else { localSchedules.push(data); } resetForm(); renderScheduleList(); } btn.disabled = false; btn.innerText = "Confirm Task"; alert("指令已發送！"); });
        }
        async function saveToCloud(payload) { try { fetch(GAS_WEB_APP_URL, { method: "POST", mode: "no-cors", cache: "no-cache", headers: { "Content-Type": "text/plain" }, body: JSON.stringify({ action: "saveSchedule", data: payload }) }); return true; } catch (e) { return false; } }
        function resetForm() { document.getElementById('surgeryForm').reset(); document.getElementById('editId').value = ''; document.getElementById('formTitle').innerText = "Add Schedule"; document.getElementById('editControls').classList.add('hidden'); document.getElementById('submitBtn').classList.remove('hidden'); }
        async function completeSelected() { if(confirm('確認完工？')) { const id = parseInt(document.getElementById('editId').value); const item = localSchedules.find(s => s.id === id); item.status = 'done'; await saveToCloud(item); resetForm(); renderScheduleList(); } }
        async function cancelSelected() { if(confirm('確定取消？')) { const id = parseInt(document.getElementById('editId').value); const item = localSchedules.find(s => s.id === id); item.status = 'cancelled'; await saveToCloud(item); resetForm(); renderScheduleList(); } }
        function toggleArchive() { const content = document.getElementById('archiveContent'); content.classList.toggle('hidden'); }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GAS 戰情中心 v5.6.0</title>
    <link rel="icon" href="data:,"> 
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/lucide/0.263.0/lucide.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Noto+Sans+TC:wght@400;700;900&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet">
    <style>
        :root { --bg-light: #f8fafc; }
        body { font-family: 'Inter', 'Noto Sans TC', sans-serif; background-color: var(--bg-light); color: #1e293b; height: 100vh; margin: 0; padding: 0; overflow: hidden; }
        
        /* 🎨 玻璃質感 */
        .glass-card-ar { background: rgba(224, 242, 254, 0.9); backdrop-filter: blur(12px); border: 2px solid #bae6fd; }
        .glass-card-he { background: rgba(245, 243, 255, 0.9); backdrop-filter: blur(12px); border: 2px solid #ddd6fe; }
        
        /* 📱 手機選單強制三等分 */
        @media (max-width: 1023px) {
            .mobile-grid-nav {
                display: flex !important;
                padding: 10px;
                gap: 8px;
                background: white;
                border-bottom: 1px solid #e2e8f0;
            }
            .nav-box {
                flex: 1 1 0% !important; /* 強制三等分 */
                width: 0 !important;      /* 防止內容撐開 */
                text-align: center;
                border: 1px solid #cbd5e1;
                border-radius: 10px;
                padding: 10px 0;
                font-size: 13px;
                font-weight: 900;
                color: #64748b;
            }
            .nav-box-active { background: #2563eb !important; color: white !important; border-color: #2563eb !important; }
        }

        /* 🔒 核心切換邏輯：強制隱藏非活動頁面 */
        .page-content { display: none !important; }
        .page-content.page-active { display: flex !important; animation: fadeIn 0.2s ease-out; }
        
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.1); border-radius: 10px; }
    </style>
</head>
<body class="flex flex-col lg:flex-row">

    <aside class="lg:w-64 w-full bg-white lg:border-r border-slate-200 flex flex-col z-[100] shadow-sm">
        <div class="p-4 lg:p-6 border-b lg:border-b-0">
            <h1 class="text-xl lg:text-2xl font-black italic text-slate-900 uppercase leading-none">Gas Command</h1>
            <p class="text-[9px] text-blue-600 font-black tracking-[0.3em] uppercase mt-1">v5.6.0 Sharp</p>
        </div>
        
        <nav class="mobile-grid-nav lg:flex-col lg:p-6 lg:space-y-2">
            <button onclick="switchPage('monitor')" id="nav-monitor" class="nav-box lg:w-full lg:flex lg:items-center lg:gap-3 lg:px-4 lg:py-3 nav-box-active">即時監控</button>
            <button onclick="switchPage('schedule')" id="nav-schedule" class="nav-box lg:w-full lg:flex lg:items-center lg:gap-3 lg:px-4 lg:py-3">備刀排程</button>
            <button onclick="switchPage('analysis')" id="nav-analysis" class="nav-box lg:w-full lg:flex lg:items-center lg:gap-3 lg:px-4 lg:py-3">數據分析</button>
        </nav>
    </aside>

    <main class="flex-1 overflow-hidden relative">
        <section id="page-monitor" class="page-content page-active h-full flex-col p-4 lg:p-10">
            <header class="flex flex-col md:flex-row justify-between items-start md:items-end mb-6 gap-3">
                <div>
                    <h2 class="text-4xl lg:text-6xl font-black italic text-slate-900 uppercase tracking-tighter leading-none">Live Status</h2>
                    <p class="text-blue-600 text-xs font-black tracking-widest mt-2 uppercase">全台鋼瓶存量監控</p>
                </div>
                <div class="flex gap-1 bg-slate-100 p-1 rounded-xl border border-slate-200">
                    <button onclick="filterRegion('ALL')" class="reg-btn px-4 py-1.5 rounded-lg text-xs font-black bg-blue-600 text-white">全域</button>
                    <button onclick="filterRegion('北區')" class="reg-btn px-4 py-1.5 rounded-lg text-xs font-black text-slate-500">北區</button>
                    <button onclick="filterRegion('中區')" class="reg-btn px-4 py-1.5 rounded-lg text-xs font-black text-slate-500">中區</button>
                    <button onclick="filterRegion('南區')" class="reg-btn px-4 py-1.5 rounded-lg text-xs font-black text-slate-500">南區</button>
                </div>
            </header>
            <div id="monitor-grid" class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-6 overflow-y-auto flex-1 custom-scrollbar pb-10"></div>
        </section>

        <section id="page-analysis" class="page-content h-full flex-col p-4 lg:p-10">
            <header class="mb-6">
                <h2 class="text-4xl lg:text-6xl font-black italic text-slate-900 uppercase tracking-tighter leading-none">Analytics</h2>
                <p class="text-blue-600 text-xs font-black tracking-widest mt-2 uppercase">數據統計分析</p>
            </header>
            <div class="grid grid-cols-3 gap-3 mb-6">
                <button onclick="updateAnalysisRegion('北區')" class="ana-reg-btn py-4 bg-slate-800 text-white rounded-2xl font-black italic border-2 border-blue-500">北區</button>
                <button onclick="updateAnalysisRegion('中區')" class="ana-reg-btn py-4 bg-white text-slate-400 rounded-2xl font-black italic border border-slate-300">中區</button>
                <button onclick="updateAnalysisRegion('南區')" class="ana-reg-btn py-4 bg-white text-slate-400 rounded-2xl font-black italic border border-slate-300">南區</button>
            </div>
            <div class="grid grid-cols-1 lg:grid-cols-2 gap-6 overflow-y-auto flex-1 custom-scrollbar">
                <div class="bg-white p-6 rounded-[2rem] border border-slate-200"><h3 class="text-xl font-black text-slate-800 mb-4 italic border-b pb-2">📋 勤務統計</h3><div id="ana-hospital-list" class="space-y-2"></div></div>
                <div class="bg-white p-6 rounded-[2rem] border border-slate-200 flex flex-col justify-center min-h-[300px]"><h3 class="text-xl font-black text-slate-800 mb-8 italic text-center">📉 平均換氣壓力</h3><div class="flex justify-around items-center"><div><p class="text-xs font-bold text-blue-500 uppercase mb-2">Ar</p><p id="ana-ar-psi" class="text-6xl font-black text-slate-900 font-mono italic">--</p></div><div class="w-px h-16 bg-slate-200"></div><div><p class="text-xs font-bold text-purple-500 uppercase mb-2">He</p><p id="ana-he-psi" class="text-6xl font-black text-slate-900 font-mono italic">--</p></div></div></div>
            </div>
        </section>

        <section id="page-schedule" class="page-content h-full flex-col p-4 lg:p-10">
            <header class="mb-6">
                <h2 class="text-4xl lg:text-6xl font-black italic text-slate-900 uppercase tracking-tighter leading-none">Schedule</h2>
                <p class="text-blue-600 text-xs font-black tracking-widest mt-2 uppercase">預定勤務管理</p>
            </header>
            <div class="grid grid-cols-1 lg:grid-cols-12 gap-6 flex-1 overflow-hidden">
                <div class="lg:col-span-4 h-fit overflow-y-auto max-h-full custom-scrollbar"><div class="bg-white p-6 rounded-[2rem] border border-slate-200"><h3 id="formTitle" class="text-2xl font-black mb-4 text-blue-600 italic">Add Task</h3><form id="surgeryForm" class="space-y-4"><input type="hidden" id="editId"><div><label class="text-[10px] font-black text-slate-400 uppercase">負責人</label><select id="userName" required class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 font-bold"></select></div><div class="grid grid-cols-2 gap-2"><div><label class="text-[10px] font-black text-slate-400 uppercase">日期</label><input type="date" id="surgeryDate" required class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-sm font-bold"></div><div><label class="text-[10px] font-black text-slate-400 uppercase">星期</label><div id="weekdayDisplay" class="py-3 bg-blue-50 text-blue-600 font-black rounded-xl text-center">--</div></div></div><div><label class="text-[10px] font-black text-slate-400 uppercase">醫院</label><select id="hospitalName" required class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 font-bold"></select></div><div class="grid grid-cols-2 gap-2 pt-2 border-t"><div class="bg-blue-50/50 p-3 rounded-xl"><span class="text-[8px] font-black text-blue-500 uppercase">HE</span><select id="heGas" class="gas-sel w-full bg-transparent font-bold text-sm outline-none"></select></div><div class="bg-slate-50/50 p-3 rounded-xl"><span class="text-[8px] font-black text-slate-500 uppercase">AR1</span><select id="ar1Gas" class="gas-sel w-full bg-transparent font-bold text-sm outline-none"></select></div></div><button type="submit" id="submitBtn" class="w-full py-5 bg-blue-600 rounded-2xl font-black text-white text-xs tracking-widest uppercase">Confirm Sync</button></form></div></div>
                <div id="scheduleGrid" class="lg:col-span-8 overflow-y-auto pb-20 space-y-3 custom-scrollbar"></div>
            </div>
        </section>
    </main>

    <div id="monitor-modal" class="fixed inset-0 z-[200] hidden flex items-center justify-center p-4 bg-slate-900/40 backdrop-blur-sm">
        <div class="bg-white w-full max-w-4xl rounded-[2.5rem] p-6 lg:p-10 relative border border-white shadow-2xl">
            <button onclick="closeMonitorModal()" class="absolute top-4 right-4 text-slate-400 hover:text-red-500"><i data-lucide="x" class="w-8 h-8"></i></button>
            <div id="monitor-modal-content"></div>
        </div>
    </div>

    <script>
        const SPREADSHEET_ID = '1Vp78y7ACG9wx3RxtAwW-s4YE9l2Ml-hcUjQ2W7QLpXU';
        const API_KEY = 'AIzaSyCQzF6JI8Oa9VsiWq5Qgg56nDX6AtXk_18'; 
        const GAS_WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbyhq3KFBvN-HQzb1eeIx2Bdg_6ZyFJMr4KxJbKajzkSMxMMZNwDHI4koSALFD6wz5d6kA/exec'; 

        const USERS = ["杜孟擇", "張家榮"];
        const HOSPITALS = ["三軍總醫院", "國立臺灣大學醫學院附設醫院", "長庚醫療財團法人林口長庚紀念醫院", "國泰綜合醫院", "醫療財團法人羅許基金會羅東博愛醫院", "新竹臺大分院新竹醫院", "佛教慈濟醫療財團法人台北慈濟醫院", "基隆長庚紀念醫院", "汐止國泰綜合醫院", "新光醫療財團法人新光吳火獅紀念醫院", "佛教慈濟醫療財團法人花蓮慈濟醫院", "臺北榮總醫院", "衛生福利部雙和醫院", "天主教輔仁大學附設醫院", "新竹國泰綜合醫院", "淡水馬偕紀念醫院", "學術會"];
        
        let latestMonitorData = []; let historicalRows = []; let localSchedules = []; let currentMonitorFilter = 'ALL';

        function safeLucide() { if (window.lucide) window.lucide.createIcons(); }

        // 🚀 核心：分頁切換
        function switchPage(pageID) {
            const allPages = document.querySelectorAll('.page-content');
            allPages.forEach(p => p.classList.remove('page-active'));
            
            const targetPage = document.getElementById('page-' + pageID);
            if (targetPage) targetPage.classList.add('page-active');
            
            document.querySelectorAll('.nav-box').forEach(btn => btn.classList.remove('nav-box-active'));
            const activeBtn = document.getElementById('nav-' + pageID);
            if (activeBtn) activeBtn.classList.add('nav-box-active');
            
            safeLucide();
        }

        window.onload = async () => { 
            initForms(); 
            await fetchMonitorData(); 
            await loadSchedulesFromCloud(); 
            await preLoadHistoricalData(); 
            updateAnalysisRegion('北區');
            safeLucide(); 
        };

        async function fetchMonitorData() {
            const url = `https://sheets.googleapis.com/v4/spreadsheets/${SPREADSHEET_ID}/values/紀錄!A2:L2000?key=${API_KEY}`;
            try {
                const res = await fetch(url); const data = await res.json();
                if (data.values) {
                    const map = new Map();
                    data.values.forEach(row => {
                        if (row[2]) map.set(row[2], { gas: row[2], region: row[3], standbyDate: row[4], location: row[5], reason: row[6], pressure: parseInt(row[7]) || 0, user: row[1], time: row[0] });
                    });
                    latestMonitorData = Array.from(map.values()).sort((a,b) => a.gas.localeCompare(b.gas));
                    renderMonitorCards();
                }
            } catch (e) { console.error(e); }
        }

        async function preLoadHistoricalData() {
            const url = `https://sheets.googleapis.com/v4/spreadsheets/${SPREADSHEET_ID}/values/紀錄!A2:H3000?key=${API_KEY}`;
            try { const res = await fetch(url); const data = await res.json(); historicalRows = data.values || []; } catch (e) { console.error(e); }
        }

        function renderMonitorCards() {
            const grid = document.getElementById('monitor-grid');
            const filtered = currentMonitorFilter === 'ALL' ? latestMonitorData : latestMonitorData.filter(d => d.region === currentMonitorFilter);
            grid.innerHTML = filtered.map(item => {
                const isAr = item.gas.toLowerCase().startsWith('ar');
                const glassClass = isAr ? 'glass-card-ar' : 'glass-card-he';
                const pct = Math.min((item.pressure / 6000) * 100, 100);
                return `
                <div onclick="showMonitorDetail('${item.gas}')" class="${glassClass} p-5 rounded-[2.5rem] cursor-pointer active:scale-95 transition-all flex flex-col justify-between h-[340px]">
                    <div class="flex justify-between items-start">
                        <div class="space-y-1">
                            <h3 class="text-4xl font-black text-slate-900 italic leading-none">${item.gas}</h3>
                            <p class="text-[13px] font-black text-blue-800 uppercase leading-none mt-2">${item.region} · ${item.location}</p>
                        </div>
                        <div class="text-right bg-white/60 p-3 rounded-2xl border border-white/80">
                            <p class="text-[10px] text-slate-500 font-black mb-1">用途</p>
                            <p class="text-blue-950 font-black text-2xl italic leading-none mb-2">${item.reason}</p>
                            <p class="text-[10px] text-slate-500 font-black mb-1">備刀日期</p>
                            <p class="text-slate-900 font-black text-base italic leading-none">${item.standbyDate || '無'}</p>
                        </div>
                    </div>
                    <div>
                        <div class="flex items-baseline gap-1 leading-none mb-2">
                            <span class="text-6xl font-mono font-black text-slate-950 italic">${item.pressure.toLocaleString()}</span>
                            <span class="text-lg font-black text-slate-400 italic font-sans">PSI</span>
                        </div>
                        <div class="w-full h-3.5 bg-white/60 rounded-full overflow-hidden border border-white/40"><div class="h-full ${(item.pressure < 3000) ? 'bg-red-500' : 'bg-blue-600'}" style="width: ${pct}%"></div></div>
                    </div>
                    <div class="flex justify-between items-end pt-4 border-t border-slate-900/10">
                        <div><p class="text-[10px] text-slate-400 font-black mb-1">負責人</p><p class="text-slate-900 font-black text-xl leading-none">${item.user}</p></div>
                        <div class="text-right"><p class="text-[10px] text-slate-400 font-black mb-1">填入時間</p><p class="text-slate-700 font-mono font-black text-[10px] leading-none">${item.time}</p></div>
                    </div>
                </div>`;
            }).join('');
            safeLucide();
        }

        function showMonitorDetail(gasName) {
            const item = latestMonitorData.find(d => d.gas === gasName); if (!item) return;
            const history = historicalRows.filter(r => r[2] === gasName).slice(-5).reverse();
            let historyHtml = history.map(h => {
                const hP = parseInt(h[7]) || 0;
                return `
                <div class="flex justify-between items-center py-3 border-b border-slate-100 last:border-0">
                    <div class="text-xs leading-tight"><p class="font-black text-slate-900 text-sm mb-1 uppercase">${h[6]} @ ${h[5]}</p><div class="flex gap-2 text-[10px] text-slate-500 font-bold italic"><span>USER: ${h[1]}</span><span>| ${h[0]}</span></div></div>
                    <div class="text-xl font-mono font-black ${hP < 3000 ? 'text-red-500' : 'text-blue-600'} italic leading-none">${hP.toLocaleString()}</div>
                </div>`;
            }).join('');
            document.getElementById('monitor-modal-content').innerHTML = `<div class="flex flex-col md:flex-row gap-8"><div class="md:w-[35%] border-b md:border-b-0 md:border-r border-slate-100 pb-6 md:pb-0 md:pr-8"><h2 class="text-6xl font-black text-slate-950 italic leading-none mb-6">${item.gas}</h2><div class="space-y-6"><div class="bg-blue-50/80 p-5 rounded-3xl border border-blue-100"><p class="text-[11px] text-slate-500 font-black uppercase mb-1 leading-none">現有存量</p><p class="text-6xl font-black text-slate-950 font-mono italic leading-none">${item.pressure.toLocaleString()}</p></div><div class="px-2"><p class="text-[11px] text-slate-500 font-black uppercase mb-1 leading-none">用途說明</p><p class="text-blue-800 font-black text-2xl italic leading-none mt-1">${item.reason}</p></div></div></div><div class="flex-1"><h3 class="text-xs font-black text-slate-400 uppercase mb-4 tracking-widest italic flex items-center gap-2">📜 最近 5 筆歷史軌跡</h3><div class="space-y-1">${historyHtml || '<p class="text-xs text-slate-300">目前尚無數據</p>'}</div></div></div><button onclick="closeMonitorModal()" class="w-full mt-8 py-5 bg-slate-950 text-white rounded-2xl font-black text-base tracking-[0.4em] uppercase shadow-lg active:scale-95">CLOSE</button>`;
            document.getElementById('monitor-modal').classList.remove('hidden'); safeLucide();
        }

        function filterRegion(r) { currentMonitorFilter = r; document.querySelectorAll('.reg-btn').forEach(b => b.classList.toggle('bg-blue-600', b.innerText.includes(r) || (r==='ALL' && b.innerText==='全域'))); document.querySelectorAll('.reg-btn').forEach(b => b.classList.toggle('text-white', b.classList.contains('bg-blue-600'))); renderMonitorCards(); }
        function closeMonitorModal() { document.getElementById('monitor-modal').classList.add('hidden'); }
        async function loadSchedulesFromCloud() { const url = `https://sheets.googleapis.com/v4/spreadsheets/${SPREADSHEET_ID}/values/備刀紀錄!A2:J2000?key=${API_KEY}`; try { const res = await fetch(url); const data = await res.json(); if (data.values) { localSchedules = data.values.map(r => ({ id: parseInt(r[0]), date: r[1], weekday: r[2], hospital: r[3], user: r[4], cases: r[5], he: r[6], ar1: r[7], ar2: r[8], status: r[9] })); renderScheduleList(); } } catch (e) { console.error(e); } }
        function renderScheduleList() { const grid = document.getElementById('scheduleGrid'); const now = new Date(); now.setHours(0,0,0,0); const sorted = [...localSchedules].sort((a, b) => new Date(a.date) - new Date(b.date)); const alerts = sorted.filter(s => new Date(s.date) < now && s.status === 'pending'); const active = sorted.filter(s => new Date(s.date) >= now && s.status === 'pending'); let html = ''; if(alerts.length > 0) html += `<div class="mb-4"><h4 class="text-[10px] font-black text-amber-600 uppercase mb-2 tracking-widest leading-none">⚠️ 逾期未處理</h4>` + alerts.map(i => getItemHtml(i, 'border-l-4 border-amber-500')).join('') + `</div>`; html += `<div class="mb-4"><h4 class="text-[10px] font-black text-slate-400 uppercase mb-2 tracking-widest leading-none">📅 預定備刀</h4>` + (active.length > 0 ? active.map(i => getItemHtml(i)).join('') : `<p class="text-sm text-slate-300 italic text-center py-10">目前無任務</p>`) + `</div>`; grid.innerHTML = html; safeLucide(); }
        function getItemHtml(item, customClass = '') { return `<div class="bg-white p-5 rounded-2xl border border-slate-100 flex justify-between items-center shadow-sm ${customClass} mb-3"><div class="flex flex-col"><span class="text-[10px] font-black text-blue-500 uppercase italic mb-1">${item.weekday} ${item.date.slice(5)}</span><span class="text-xl font-black text-slate-900">${item.hospital}</span><span class="text-[11px] text-slate-400 font-bold uppercase tracking-tighter">負責人: ${item.user}</span></div><div class="flex gap-2"><div class="bg-blue-50 px-4 py-2 rounded-xl text-center"><p class="text-[8px] font-black text-blue-500 leading-none mb-1">HE</p><p class="text-lg font-black text-slate-800 leading-none">${item.he}</p></div><div class="bg-slate-50 px-4 py-2 rounded-xl text-center"><p class="text-[8px] font-black text-slate-500 leading-none mb-1">AR1</p><p class="text-lg font-black text-slate-800 leading-none">${item.ar1}</p></div></div></div>`; }
        function updateAnalysisRegion(region) { document.querySelectorAll('.ana-reg-btn').forEach(btn => { if(btn.innerText.includes(region)) { btn.className = "ana-reg-btn py-4 bg-slate-800 text-white rounded-2xl font-black italic border-2 border-blue-500 shadow-md"; } else { btn.className = "ana-reg-btn py-4 bg-white text-slate-400 rounded-2xl font-black italic border border-slate-300 shadow-sm"; } }); const hospitalCount = {}; let arTotal = 0, arCount = 0, heTotal = 0, heCount = 0; historicalRows.forEach(row => { const time = row[0] || "", gasID = row[2] || "", reg = row[3] || "", hospital = row[5] || "", reason = row[6] || "", psi = parseInt(row[7]) || 0; if (reg === region) { if (time.includes("2026") && hospital) hospitalCount[hospital] = (hospitalCount[hospital] || 0) + 1; if (reason === "待灌氣") { if (gasID.toLowerCase().startsWith("ar")) { arTotal += psi; arCount++; } else if (gasID.toLowerCase().startsWith("he")) { heTotal += psi; heCount++; } } } }); const listArea = document.getElementById('ana-hospital-list'); const sorted = Object.entries(hospitalCount).sort((a,b) => b[1] - a[1]); listArea.innerHTML = sorted.length > 0 ? sorted.map(([name, count]) => ` <div class="flex justify-between items-center bg-slate-50 p-4 rounded-xl border border-slate-200 shadow-sm"><span class="font-black text-slate-700">${name}</span><span class="bg-blue-600 text-white px-4 py-1 rounded-full text-[10px] font-black italic leading-none">${count} VISITS</span></div> `).join('') : '<p class="text-slate-400 text-center py-10 leading-none">尚無紀錄</p>'; document.getElementById('ana-ar-psi').innerText = arCount > 0 ? Math.round(arTotal/arCount) : "--"; document.getElementById('ana-he-psi').innerText = heCount > 0 ? Math.round(heTotal/heCount) : "--"; }
        function initForms() { const uSel = document.getElementById('userName'); const hSel = document.getElementById('hospitalName'); const gSels = document.querySelectorAll('.gas-sel'); USERS.forEach(u => uSel.add(new Option(u, u))); HOSPITALS.forEach(h => hSel.add(new Option(h, h))); for(let v=6000; v>=2500; v-=100) gSels.forEach(s => s.add(new Option(v+' PSI', v))); document.getElementById('surgeryDate').addEventListener('input', (e) => { const days = ['週日','週一','週二','週三','週四','週五','週六']; document.getElementById('weekdayDisplay').innerText = days[new Date(e.target.value).getDay()] || '--'; }); }
    </script>
</body>

<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GAS 戰情中心 v6.3.0</title>
    <link rel="icon" href="data:,"> 
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/lucide/0.263.0/lucide.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Noto+Sans+TC:wght@400;700;900&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet">
    <style>
        :root { --bg-light: #f8fafc; }
        body { font-family: 'Inter', 'Noto Sans TC', sans-serif; background-color: var(--bg-light); color: #1e293b; min-height: 100vh; margin: 0; padding: 0; }
        .glass-card-ar { background: rgba(224, 242, 254, 0.95); backdrop-filter: blur(12px); border: 2px solid #bae6fd; }
        .glass-card-he { background: rgba(245, 243, 255, 0.95); backdrop-filter: blur(12px); border: 2px solid #ddd6fe; }
        @media (max-width: 1023px) {
            .mobile-grid-nav { display: flex !important; position: sticky; top: 0; z-index: 100; padding: 10px; gap: 8px; background: white; border-bottom: 1px solid #e2e8f0; }
            .nav-box { flex: 1 !important; text-align: center; border: 1px solid #cbd5e1; border-radius: 12px; padding: 12px 0; font-size: 14px; font-weight: 900; color: #64748b; background: #f1f5f9; }
            .nav-box-active { background: #2563eb !important; color: white !important; border-color: #2563eb !important; box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3); }
        }
        .desktop-nav-active { background: #2563eb !important; color: white !important; box-shadow: 0 4px 12px rgba(37, 99, 235, 0.2); }
        .page-content { display: none !important; }
        .page-active { display: flex !important; animation: fadeIn 0.2s ease-out; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        #monitor-list-view { display: none; width: 100%; background: white; border-radius: 1.5rem; border: 1px solid #e2e8f0; overflow: hidden; }
        .list-table { width: 100%; border-collapse: collapse; table-layout: fixed; font-size: 13px; }
        .list-table th { background: #f8fafc; padding: 12px 10px; text-align: left; font-weight: 900; color: #64748b; border-bottom: 2px solid #e2e8f0; text-transform: uppercase; }
        .list-row { border-bottom: 1px solid #f1f5f9; height: 52px; transition: background 0.2s; cursor: pointer; }
        .list-row:hover { background: #f0f7ff; }
        .col-gas { width: 75px; font-family: 'JetBrains Mono', monospace; font-weight: 800; padding-left: 15px; }
        .col-psi { width: 95px; font-weight: 900; text-align: right; padding-right: 15px; }
        .col-info { width: auto; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .psi-low { color: #ef4444; animation: blink 1.5s infinite; }
        @keyframes blink { 50% { opacity: 0.5; } }
        #schedule-drawer { transition: transform 0.3s ease-in-out; }
        .drawer-open { transform: translateX(0) !important; }
        .custom-scrollbar::-webkit-scrollbar { width: 5px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.1); border-radius: 10px; }
        /* 🟢 日期選取器優化 */
        .date-container { position: relative; overflow: hidden; border-radius: 0.75rem; }
        input[type="date"] { position: relative; z-index: 10; cursor: pointer; width: 100%; }
        input[type="date"]::-webkit-calendar-picker-indicator { position: absolute; left: 0; top: 0; width: 100%; height: 100%; margin: 0; padding: 0; cursor: pointer; opacity: 0; z-index: 20; }
    </style>
</head>
<body class="flex flex-col lg:flex-row overflow-x-hidden">

        <section id="page-analysis" class="page-content flex-col">
            <header class="mb-10"><h2 class="text-5xl lg:text-7xl font-black italic text-slate-900 uppercase tracking-tighter">Analytics</h2></header>

                <button onclick="updateAnalysisRegion('北區')" class="ana-reg-btn py-5 bg-slate-950 text-white rounded-2xl font-black italic border-2 border-blue-500 shadow-md">北區分析</button>

            </div>
            <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
                <div class="bg-white p-8 rounded-[2.5rem] border border-slate-100 shadow-sm"><h3 class="text-2xl font-black text-slate-900 mb-6 italic border-b-2 pb-3">📋 2026年備刀次數統計</h3><div id="ana-hospital-list" class="space-y-2"></div></div>
                <div class="bg-white p-8 rounded-[2.5rem] border border-slate-100 flex flex-col justify-center min-h-[400px] shadow-sm"><h3 class="text-2xl font-black text-slate-900 mb-10 italic text-center uppercase tracking-tighter">📉 平均換氣壓力</h3><div class="flex justify-around items-center"><div class="text-center"><p class="text-sm font-black text-blue-500 uppercase mb-4 tracking-widest">Argon (Ar)</p><p id="ana-ar-psi" class="text-7xl font-black text-slate-950 font-mono italic">--</p></div><div class="w-px h-24 bg-slate-100"></div><div class="text-center"><p class="text-sm font-black text-purple-500 uppercase mb-4 tracking-widest">Helium (He)</p><p id="ana-he-psi" class="text-7xl font-black text-slate-950 font-mono italic">--</p></div></div></div>
            </div>
        </section>

        <section id="page-schedule" class="page-content flex-col">
            <header class="mb-8"><h2 class="text-5xl lg:text-7xl font-black italic text-slate-900 uppercase tracking-tighter">Schedule</h2></header>
            <div class="grid grid-cols-1 lg:grid-cols-12 gap-8">
                <div class="lg:col-span-4 h-fit">
                    <div class="bg-white p-6 rounded-[2rem] border border-slate-200 shadow-md">
                        <h3 id="formTitle" class="text-2xl font-black mb-6 text-blue-600 italic leading-none">Add Task</h3>
                        <form id="surgeryForm" class="space-y-4">
                            <input type="hidden" id="editId">
                            <div><label class="text-[10px] font-black text-slate-400 block mb-1 uppercase tracking-widest">負責人</label><select id="userName" required class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 font-bold text-base outline-none"></select></div>
                            <div class="grid grid-cols-2 gap-3"><div class="date-container"><label class="text-[10px] font-black text-slate-400 block mb-1 uppercase tracking-widest">日期</label><input type="date" id="surgeryDate" required class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-3 text-sm font-bold outline-none"></div><div><label class="text-[10px] font-black text-slate-400 block mb-1 uppercase tracking-widest">星期</label><div id="weekdayDisplay" class="py-3 bg-blue-50 text-blue-700 font-black rounded-xl text-center text-base italic">--</div></div></div>
                            <div><label class="text-[10px] font-black text-slate-400 block mb-1 uppercase tracking-widest">目標醫院</label><select id="hospitalName" required class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 font-bold text-base outline-none"></select></div>
                            <div class="grid grid-cols-2 gap-3 pt-2 border-t border-slate-100">
                                <div class="bg-blue-50/50 p-3 rounded-xl"><span class="text-[9px] font-black text-blue-500 uppercase mb-1 block leading-none">HE1 氦氣 (必填)</span><select id="heGas" class="gas-sel w-full bg-transparent border-none font-black text-lg italic outline-none"></select></div>
                                <div class="bg-blue-50/20 p-3 rounded-xl"><span class="text-[9px] font-black text-blue-400 uppercase mb-1 block leading-none">HE2 (選填)</span><select id="he2Gas" class="gas-sel w-full bg-transparent border-none font-black text-lg italic outline-none"><option value="無">無</option></select></div>
                            </div>
                            <div class="grid grid-cols-2 gap-3">
                                <div class="bg-slate-50/50 p-3 rounded-xl"><span class="text-[9px] font-black text-slate-500 uppercase mb-1 block leading-none">AR1 氬氣 (必填)</span><select id="ar1Gas" class="gas-sel w-full bg-transparent border-none font-black text-lg italic outline-none"></select></div>
                                <div class="bg-slate-50/30 p-3 rounded-xl"><span class="text-[9px] font-black text-slate-400 uppercase mb-1 block leading-none">AR2 (選填)</span><select id="ar2Gas" class="gas-sel w-full bg-transparent border-none font-black text-lg italic outline-none"><option value="無">無</option></select></div>
                            </div>
                            <div class="bg-slate-50/10 p-3 rounded-xl"><span class="text-[9px] font-black text-slate-300 uppercase mb-1 block leading-none">AR3 (選填)</span><select id="ar3Gas" class="gas-sel w-full bg-transparent border-none font-black text-lg italic outline-none"><option value="無">無</option></select></div>
                            <button type="submit" id="submitBtn" class="w-full py-5 bg-blue-600 rounded-[1.5rem] font-black text-white text-sm tracking-[0.2em] uppercase italic shadow-lg active:scale-95 transition-all">Confirm Sync</button>
                            <div id="editControls" class="hidden space-y-3"><button type="submit" class="w-full py-4 bg-blue-900 text-white rounded-2xl font-black text-sm uppercase italic shadow-lg">Update Sync</button><div class="grid grid-cols-2 gap-2"><button type="button" onclick="completeTask()" class="py-4 bg-green-500 text-white rounded-2xl font-black text-xs uppercase">完工</button><button type="button" onclick="cancelTask()" class="py-4 bg-red-500 text-white rounded-2xl font-black text-xs uppercase">取消</button></div><button type="button" onclick="resetForm()" class="w-full text-[10px] text-slate-400 font-bold uppercase py-2">放棄編輯</button></div>
                        </form>
                    </div>
                </div>
                <div class="lg:col-span-8 flex flex-col">
                    <div id="alertSection" class="mb-6 hidden"><h4 class="text-[12px] font-black text-amber-600 uppercase mb-3 tracking-widest flex items-center gap-2"><i data-lucide="alert-triangle" class="w-4 h-4"></i> ⚠️ 逾期未結案</h4><div id="alertGrid" class="space-y-3"></div></div>
                    <h4 class="text-[12px] font-black text-slate-400 uppercase mb-4 tracking-widest flex items-center gap-2 border-b pb-2"><i data-lucide="calendar-range" class="w-4 h-4"></i> 📋 預定備刀排程</h4>
                    <div id="scheduleGrid" class="space-y-4"></div>
                    <div class="mt-10 bg-slate-100/50 rounded-3xl border border-slate-200 overflow-hidden shadow-inner"><button onclick="toggleHistory()" class="w-full p-5 flex justify-between items-center hover:bg-slate-100 transition-all"><span class="text-[11px] font-black text-slate-500 uppercase tracking-[0.2em] flex items-center gap-3"><i data-lucide="history" class="w-4 h-4"></i> 最近 7 天紀錄清單</span><i id="historyIcon" data-lucide="chevron-down" class="w-5 h-5 text-slate-400 transition-transform"></i></button><div id="historyList" class="hidden p-5 pt-0 space-y-3 max-h-[500px] overflow-y-auto custom-scrollbar"></div></div>
                </div>
            </div>
        </section>
    </main>

    <div id="drawer-overlay" onclick="closeDrawer()" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-[150] hidden transition-opacity"></div>
    <div id="schedule-drawer" class="fixed top-0 right-0 h-full w-[85%] md:w-[400px] bg-white shadow-2xl z-[200] translate-x-full flex flex-col border-l border-slate-200">
        <div class="p-6 border-b flex justify-between items-center bg-slate-50"><h3 class="text-xl font-black italic text-slate-900 flex items-center gap-2"><i data-lucide="calendar-check" class="w-5 h-5 text-blue-600"></i>近期備刀排程</h3><button onclick="closeDrawer()" class="p-2 hover:bg-slate-200 rounded-full transition-colors"><i data-lucide="x" class="w-6 h-6"></i></button></div>
        <div id="drawer-content" class="flex-1 overflow-y-auto p-4 space-y-3 custom-scrollbar"></div>
    </div>
    <div id="monitor-modal" class="fixed inset-0 z-[250] hidden flex items-center justify-center p-4 bg-slate-900/50 backdrop-blur-md"><div class="bg-white/95 backdrop-blur-2xl w-full max-w-5xl max-h-[92vh] overflow-y-auto rounded-3xl p-6 lg:p-12 relative shadow-2xl border border-white/50 custom-scrollbar"><button onclick="closeMonitorModal()" class="absolute top-6 right-6 text-slate-400 hover:text-red-500 transition-all"><i data-lucide="x" class="w-10 h-10"></i></button><div id="monitor-modal-content"></div></div></div>
<script>
    const SPREADSHEET_ID = '1Vp78y7ACG9wx3RxtAwW-s4YE9l2Ml-hcUjQ2W7QLpXU';
    const API_KEY = 'AIzaSyCQzF6JI8Oa9VsiWq5Qgg56nDX6AtXk_18'; 
    const GAS_WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbyhq3KFBvN-HQzb1eeIx2Bdg_6ZyFJMr4KxJbKajzkSMxMMZNwDHI4koSALFD6wz5d6kA/exec'; 

    const USERS = ["杜孟擇", "張家榮"];
    const HOSPITALS = ["三軍總醫院", "國立臺灣大學醫學院附設醫院", "長庚醫療財團法人林口長庚紀念醫院", "國泰綜合醫院", "醫療財團法人羅許基金會羅東博愛醫院", "新竹臺大分院新竹醫院", "佛教慈濟醫療財團法人台北慈濟醫院", "基隆長庚紀念醫院", "汐止國泰綜合醫院", "新光醫療財團法人新光吳火獅紀念醫院", "佛教慈濟醫療財團法人花蓮慈濟醫院", "臺北榮總醫院", "衛生福利部雙和醫院", "天主教輔仁大學附設醫院", "新竹國泰綜合醫院", "淡水馬偕紀念醫院", "學術會"];
    
    let latestMonitorData = []; let historicalRows = []; let localSchedules = []; 
    let currentMonitorFilter = localStorage.getItem('gas_last_region') || 'ALL'; 
    let isPressurePriority = false;
    let currentView = localStorage.getItem('gas_last_view') || 'card';

    function safeLucide() { if (window.lucide) window.lucide.createIcons(); }

    window.onload = async () => { 
        initForms(); await fetchMonitorData(); await loadSchedulesFromCloud(); await preLoadHistoricalData(); 
        filterRegion(currentMonitorFilter); updateViewButtonUI(); updateAnalysisRegion('北區'); safeLucide(); 
    };

    async function fetchMonitorData() {
        const url = `https://sheets.googleapis.com/v4/spreadsheets/${SPREADSHEET_ID}/values/紀錄!A2:L2000?key=${API_KEY}`;
        try {
            const res = await fetch(url); const data = await res.json();
            if (data.values) {
                const map = new Map();
                data.values.forEach(row => { if (row[2]) map.set(row[2], { gas: row[2], region: row[3], standbyDate: row[4], location: row[5], reason: row[6], pressure: parseInt(row[7]) || 0, user: row[1], time: row[0] }); });
                latestMonitorData = Array.from(map.values()); renderMonitorMain();
            }
        } catch (e) { console.error(e); }
    }

    function renderMonitorMain() { if (currentView === 'list') renderListView(); else renderMonitorCards(); }

    function getFilteredAndSortedData() {
        let data = currentMonitorFilter === 'ALL' ? latestMonitorData : latestMonitorData.filter(d => d.region === currentMonitorFilter);
        if (isPressurePriority) data.sort((a, b) => b.pressure - a.pressure);
        else {
            const getPrio = s => { const m = s.match(/([a-zA-Z]+)(\d+)/); if(!m) return [s, 0]; return [m[1].toLowerCase() === 'ar' ? 1 : 2, parseInt(m[2])]; };
            data.sort((a, b) => { const [pA, nA] = getPrio(a.gas); const [pB, nB] = getPrio(b.gas); return pA !== pB ? pA - pB : nA - nB; });
        }
        return data;
    }

    function renderMonitorCards() {
        const grid = document.getElementById('monitor-grid'); let data = getFilteredAndSortedData();
        grid.innerHTML = data.map(item => {
            // 🟢 新警告定義：HE < 3000, AR < 4000
            const isLow = item.gas.toLowerCase().startsWith('he') ? item.pressure < 3000 : item.pressure < 4000;
            const glassClass = item.gas.toLowerCase().startsWith('ar') ? 'glass-card-ar' : 'glass-card-he';
            return `<div onclick="showMonitorDetail('${item.gas}')" class="${glassClass} p-5 rounded-[2.2rem] cursor-pointer transition-all flex flex-col justify-between h-[260px] shadow-sm active:scale-95">
                <div class="flex justify-between items-start"><div class="space-y-1"><h3 class="text-3xl font-black text-slate-900 italic leading-none">${item.gas}</h3><p class="text-base font-black text-blue-800 leading-none mt-2 tracking-tighter">${item.region}</p></div><div class="text-right"><p class="text-blue-900 font-black text-xl italic leading-none mb-1 tracking-tighter">${item.reason}</p><p class="text-[11px] text-slate-500 font-black italic leading-none">${item.standbyDate || '無'}</p></div></div>
                <div><div class="flex items-baseline gap-1 leading-none mb-2"><span class="text-5xl font-mono font-black italic tracking-tighter ${isLow ? 'text-red-500 animate-pulse' : 'text-slate-950'}">${item.pressure.toLocaleString()}</span><span class="text-sm font-black text-slate-400 italic">PSI</span></div>
                <div class="w-full h-3 bg-white/60 rounded-full overflow-hidden border border-white/40"><div class="h-full ${isLow ? 'bg-red-500' : 'bg-blue-600'}" style="width: ${Math.min((item.pressure / 6000) * 100, 100)}%"></div></div><p class="text-[14px] font-bold text-slate-600 mt-2 truncate">📍 ${item.location || '倉庫'}</p></div>
                <div class="flex justify-between items-end pt-2 border-t border-slate-900/10"><p class="text-slate-900 font-black text-base">${item.user}</p><p class="text-slate-500 font-mono text-[9px] leading-none">${item.time}</p></div></div>`;
        }).join(''); safeLucide();
    }

    function renderListView() {
        const tbody = document.getElementById('list-body'); let data = getFilteredAndSortedData();
        tbody.innerHTML = data.map(item => {
            const isLow = item.gas.toLowerCase().startsWith('he') ? item.pressure < 3000 : item.pressure < 4000;
            const psiClass = isLow ? 'psi-low' : (item.pressure > 5500 ? 'psi-vhigh' : '');
            // 🟢 備刀日期變藍邏輯
            const hasDate = item.standbyDate && item.standbyDate !== "" && item.standbyDate !== "無";
            const dateStyle = hasDate ? "text-blue-600 font-black" : "text-slate-300 font-medium";
            return `<tr class="list-row" onclick="showMonitorDetail('${item.gas}')"><td class="col-gas italic text-slate-900">${item.gas}</td><td class="col-psi font-mono italic ${psiClass}">${item.pressure.toLocaleString()}</td><td class="col-info"><div class="flex flex-col"><span class="font-bold text-slate-800 truncate">${item.location || '倉庫'}</span><span class="text-[10px] text-blue-600 font-black tracking-tighter uppercase leading-none">${item.reason}</span></div></td><td class="col-date ${dateStyle}">${hasDate ? item.standbyDate : '-'}</td></tr>`;
        }).join('');
    }

    function toggleViewCycle() { currentView = (currentView === 'card') ? 'list' : 'card'; localStorage.setItem('gas_last_view', currentView); renderMonitorMain(); updateViewButtonUI(); safeLucide(); }
    function updateViewButtonUI() {
        const btn = document.getElementById('viewToggleBtn'); const iconEl = document.getElementById('viewToggleIcon'); const textEl = document.getElementById('viewToggleText');
        if (currentView === 'list') { iconEl.setAttribute('data-lucide', 'layout-grid'); textEl.innerText = "卡片模式"; btn.classList.add('bg-blue-50', 'border-blue-200', 'text-blue-600'); document.getElementById('monitor-grid').style.display = 'none'; document.getElementById('monitor-list-view').style.display = 'block'; }
        else { iconEl.setAttribute('data-lucide', 'list'); textEl.innerText = "清單模式"; btn.classList.remove('bg-blue-50', 'border-blue-200', 'text-blue-600'); document.getElementById('monitor-grid').style.display = 'grid'; document.getElementById('monitor-list-view').style.display = 'none'; }
    }

    function toggleSortMode() { isPressurePriority = !isPressurePriority; const btn = document.getElementById('sortToggleBtn'); btn.innerHTML = isPressurePriority ? '<i data-lucide="sort-desc" class="w-4 h-4"></i> 壓力優先 ON' : '<i data-lucide="arrow-down-narrow-wide" class="w-4 h-4"></i> 壓力優先 OFF'; btn.classList.toggle('bg-blue-600', isPressurePriority); btn.classList.toggle('text-white', isPressurePriority); renderMonitorMain(); safeLucide(); }
    function filterRegion(r) { currentMonitorFilter = r; localStorage.setItem('gas_last_region', r); document.querySelectorAll('.reg-btn').forEach(b => { b.classList.toggle('bg-blue-600', b.innerText.includes(r)); b.classList.toggle('text-white', b.innerText.includes(r)); }); renderMonitorMain(); if(document.getElementById('schedule-drawer').classList.contains('drawer-open')) renderDrawerSchedules(); }

    function openDrawer() { document.getElementById('drawer-overlay').classList.remove('hidden'); document.getElementById('schedule-drawer').classList.add('drawer-open'); renderDrawerSchedules(); }
    function closeDrawer() { document.getElementById('drawer-overlay').classList.add('hidden'); document.getElementById('schedule-drawer').classList.remove('drawer-open'); }
    
    // 🟢 抽屜一鍵完工邏輯
    async function drawerCompleteTask(id) {
        const item = localSchedules.find(s => s.id.toString() === id.toString()); if (!item) return;
        if (!confirm(`確認將【${item.hospital}】備刀任務設為完工？`)) return;
        item.status = 'done';
        const success = await saveToCloud(item);
        if (success) { renderScheduleList(); renderDrawerSchedules(); }
    }

    function renderDrawerSchedules() {
        const container = document.getElementById('drawer-content'); const pending = localSchedules.filter(s => s.status === 'pending');
        container.innerHTML = pending.map(item => {
            // 🟢 氣體數量顯示優化：有填才顯示
            let gasText = `HE1:${item.he} / AR1:${item.ar1}`;
            if(item.he2 && item.he2 !== "無") gasText += ` / HE2:${item.he2}`;
            if(item.ar2 && item.ar2 !== "無") gasText += ` / AR2:${item.ar2}`;
            if(item.ar3 && item.ar3 !== "無") gasText += ` / AR3:${item.ar3}`;
            return `<div onclick="drawerCompleteTask('${item.id}')" class="bg-slate-50 p-5 rounded-2xl border border-slate-200 cursor-pointer hover:bg-blue-50 hover:border-blue-200 transition-all active:scale-95 shadow-sm">
                <div class="flex justify-between items-center mb-1"><span class="text-[11px] font-black text-blue-600 italic uppercase">${item.date}</span><span class="text-[13px] font-black text-slate-700">${gasText}</span></div>
                <h4 class="text-lg font-black text-slate-900 leading-tight uppercase">${item.hospital}</h4>
                <div class="flex justify-between items-center mt-1"><p class="text-xs text-slate-500 font-bold uppercase">BY: ${item.user}</p><span class="text-[9px] font-black text-blue-400">點擊完工</span></div>
            </div>`;
        }).join('') || '<p class="text-center text-slate-300 py-10 italic">目前無排程</p>';
    }

    function showMonitorDetail(gasName) {
        const item = latestMonitorData.find(d => d.gas === gasName); if (!item) return;
        const history = historicalRows.filter(r => r[2] === gasName).slice(-5).reverse();
        let historyHtml = history.map(h => {
            const hP = parseInt(h[7]) || 0;
            const hLow = h[2].toLowerCase().startsWith('he') ? hP < 3000 : hP < 4000;
            return `<div class="flex justify-between items-center py-4 border-b border-slate-100 last:border-0"><div class="text-xs leading-tight"><p class="font-black text-slate-900 text-base mb-1.5 uppercase tracking-tighter">${h[6]} @ ${h[5]}</p><div class="flex gap-3 text-[11px] text-slate-500 font-bold italic uppercase"><span>BY: ${h[1]}</span><span>| ${h[0]}</span></div></div><div class="text-2xl font-mono font-black ${hLow ? 'text-red-500' : 'text-blue-600'} italic leading-none">${hP.toLocaleString()} <span class="text-xs font-sans">PSI</span></div></div>`;
        }).join('');
        document.getElementById('monitor-modal-content').innerHTML = `<div class="flex flex-col md:flex-row gap-10"><div class="md:w-[30%] border-b md:border-b-0 md:border-r border-slate-100 pb-8 md:pb-0 md:pr-10"><h2 class="text-5xl lg:text-7xl font-black text-slate-950 italic mb-8 uppercase">${item.gas}</h2><div class="bg-blue-50 p-6 rounded-[2.5rem] shadow-inner mb-8"><p class="text-xs text-slate-500 font-black uppercase mb-2">當前壓力</p><div class="flex items-baseline gap-2"><span class="text-6xl font-black italic">${item.pressure.toLocaleString()}</span><span class="text-base font-bold text-slate-400">PSI</span></div></div><div class="px-3"><p class="text-xs text-slate-500 font-black uppercase mb-2">用途</p><p class="text-blue-800 font-black text-3xl italic uppercase">${item.reason}</p></div></div><div class="flex-1"><h3 class="text-[13px] font-black text-slate-400 uppercase mb-5 tracking-widest italic flex items-center gap-3">📜 最近 5 筆歷史異動</h3>${historyHtml || '<p class="text-sm text-slate-300">尚無異動數據</p>'}</div></div><button onclick="closeMonitorModal()" class="w-full mt-10 py-5 bg-slate-950 text-white rounded-2xl font-black text-lg tracking-[0.5em] uppercase shadow-xl transition-all active:scale-95">CLOSE</button>`;
        document.getElementById('monitor-modal').classList.remove('hidden'); safeLucide();
    }

    function editTask(id) {
        const item = localSchedules.find(s => s.id.toString() === id.toString()); if (!item) return;
        document.getElementById('editId').value = item.id; document.getElementById('userName').value = item.user; document.getElementById('surgeryDate').value = item.date; document.getElementById('hospitalName').value = item.hospital;
        document.getElementById('heGas').value = item.he; document.getElementById('he2Gas').value = item.he2 || '無';
        document.getElementById('ar1Gas').value = item.ar1; document.getElementById('ar2Gas').value = item.ar2 || '無'; document.getElementById('ar3Gas').value = item.ar3 || '無';
        document.getElementById('weekdayDisplay').innerText = item.weekday || '--';
        document.getElementById('formTitle').innerText = "Edit Task"; document.getElementById('submitBtn').classList.add('hidden'); document.getElementById('editControls').classList.remove('hidden');
        window.scrollTo({top: 0, behavior: 'smooth'});
    }

    async function completeTask() { if(!confirm("完工？")) return; const id = document.getElementById('editId').value; const item = localSchedules.find(s => s.id.toString() === id); item.status = 'done'; await saveToCloud(item); loadSchedulesFromCloud(); resetForm(); }
    async function cancelTask() { if(!confirm("取消？")) return; const id = document.getElementById('editId').value; const item = localSchedules.find(s => s.id.toString() === id); item.status = 'cancelled'; await saveToCloud(item); loadSchedulesFromCloud(); resetForm(); }
    function resetForm() { document.getElementById('surgeryForm').reset(); document.getElementById('editId').value = ''; document.getElementById('formTitle').innerText = "Add Task"; document.getElementById('submitBtn').classList.remove('hidden'); document.getElementById('editControls').classList.add('hidden'); document.getElementById('weekdayDisplay').innerText='--'; }
    async function saveToCloud(p) { try { await fetch(GAS_WEB_APP_URL, { method: "POST", mode: "no-cors", body: JSON.stringify({ action: "saveSchedule", data: p }) }); alert("✅ 同步指令已發出！"); return true; } catch (e) { return false; } }

    async function loadSchedulesFromCloud() {
        const url = `https://sheets.googleapis.com/v4/spreadsheets/${SPREADSHEET_ID}/values/備刀紀錄!A2:J2000?key=${API_KEY}`;
        try { const res = await fetch(url); const data = await res.json(); if (data.values) { localSchedules = data.values.map(r => ({ id: r[0], date: r[1], weekday: r[2], hospital: r[3], user: r[4], cases: r[5], he: r[6], ar1: r[7], ar2: r[8], he2: r[9] || '無', ar3: r[10] || '無', status: r[11] || r[9] })); renderScheduleList(); } } catch (e) { console.error(e); }
    }

    function renderScheduleList() {
        const now = new Date(); now.setHours(0,0,0,0); const grid = document.getElementById('scheduleGrid'); const alertGrid = document.getElementById('alertGrid'); const historyList = document.getElementById('historyList');
        const alerts = localSchedules.filter(s => new Date(s.date) < now && s.status === 'pending'); document.getElementById('alertSection').classList.toggle('hidden', alerts.length === 0);
        alertGrid.innerHTML = alerts.map(item => getItemHtml(item, 'border-l-8 border-amber-500 bg-amber-50/30')).join('');
        const pending = localSchedules.filter(s => new Date(s.date) >= now && s.status === 'pending').sort((a,b) => new Date(a.date) - new Date(b.date));
        grid.innerHTML = pending.map(item => getItemHtml(item, 'hover:border-blue-400 cursor-pointer')).join('') || '<p class="text-base italic py-16 text-center text-slate-300">目前無待辦任務</p>';
        const history = localSchedules.filter(s => s.status !== 'pending').sort((a,b) => new Date(b.date) - new Date(a.date));
        historyList.innerHTML = history.map(item => `<div class="flex justify-between items-center bg-white/70 p-5 rounded-2xl border border-slate-100 opacity-60"><div class="flex flex-col"><span class="text-[10px] text-slate-400 line-through mb-1">${item.date}</span><span class="text-lg font-black text-slate-500 line-through">${item.hospital}</span></div><div class="flex gap-3"><span class="text-[9px] font-black px-2 py-1 rounded ${item.status==='done'?'bg-green-100 text-green-600':'bg-red-100 text-red-600'}">${item.status.toUpperCase()}</span></div></div>`).join('') || '<p class="text-sm text-center py-6 text-slate-400">尚無近期紀錄</p>'; safeLucide();
    }

    function getItemHtml(item, customClass) { 
        let gasStr = `HE1:${item.he} / AR1:${item.ar1}`;
        if(item.he2 && item.he2 !== "無") gasStr += `<br>HE2:${item.he2}`;
        if(item.ar2 && item.ar2 !== "無") gasStr += `<br>AR2:${item.ar2}`;
        if(item.ar3 && item.ar3 !== "無") gasStr += `<br>AR3:${item.ar3}`;
        return `<div onclick="editTask('${item.id}')" class="bg-white p-6 rounded-[2.5rem] border border-slate-100 flex justify-between items-center shadow-sm transition-all active:scale-[0.98] ${customClass}"><div class="flex flex-col"><span class="text-sm font-black text-blue-600 italic mb-1">${item.weekday || ''} ${item.date}</span><span class="text-xl font-black text-slate-900 uppercase">${item.hospital}</span><span class="text-[13px] text-slate-400 font-bold uppercase mt-1">負責人: ${item.user}</span></div><div class="flex gap-3"><div class="bg-blue-50 px-5 py-4 rounded-[1.5rem] text-center shadow-inner leading-tight"><p class="text-[10px] font-black text-blue-500 mb-1.5 uppercase">GAS INFO</p><p class="text-xs font-black text-slate-700 italic">${gasStr}</p></div></div></div>`; 
    }

    function updateAnalysisRegion(region) {
        document.querySelectorAll('.ana-reg-btn').forEach(btn => btn.className = btn.innerText.includes(region) ? "ana-reg-btn py-5 bg-slate-950 text-white rounded-2xl font-black italic border-2 border-blue-500 shadow-md" : "ana-reg-btn py-5 bg-white text-slate-400 rounded-2xl font-black italic border border-slate-200");
        const counts = {}; let aT=0, aC=0, hT=0, hC=0;
        historicalRows.forEach(row => { if (row[3] === region) { if (row[0].includes("2026") && row[5]) counts[row[5]] = (counts[row[5]] || 0) + 1; if (row[6] === "待灌氣") { const p = parseInt(row[7]) || 0; if (row[2].toLowerCase().startsWith("ar")) { aT += p; aC++; } else { hT += p; hC++; } } } });
        const sorted = Object.entries(counts).sort((a,b) => b[1] - a[1]);
        document.getElementById('ana-hospital-list').innerHTML = sorted.length > 0 ? sorted.map(([n, c]) => `<div class="flex justify-between items-center bg-slate-50 p-5 rounded-2xl border border-slate-200"><span class="font-black text-slate-800 text-lg">${n}</span><span class="bg-blue-600 text-white px-5 py-1.5 rounded-full text-xs font-black italic">${c} VISITS</span></div>`).join('') : '<p class="text-slate-400 text-center py-16 italic">尚無 2026 年度數據</p>';
        document.getElementById('ana-ar-psi').innerText = aC > 0 ? Math.round(aT/aC) : "--"; document.getElementById('ana-he-psi').innerText = hC > 0 ? Math.round(hT/hC) : "--";
    }

    async function preLoadHistoricalData() { const url = `https://sheets.googleapis.com/v4/spreadsheets/${SPREADSHEET_ID}/values/紀錄!A2:H3000?key=${API_KEY}`; try { const res = await fetch(url); const data = await res.json(); historicalRows = data.values || []; } catch (e) { console.error(e); } }
    function initForms() {
        const uSel = document.getElementById('userName'); const hSel = document.getElementById('hospitalName'); const gSels = document.querySelectorAll('.gas-sel');
        USERS.forEach(u => uSel.add(new Option(u, u))); HOSPITALS.forEach(h => hSel.add(new Option(h, h)));
        for(let v=6000; v>=2500; v-=100) gSels.forEach(s => s.add(new Option(v+' PSI', v))); 
        [1,3,4].forEach(idx => gSels[idx].add(new Option('無', '無'), 0)); // HE2, AR2, AR3 加上無
        document.getElementById('surgeryDate').addEventListener('input', (e) => { const days=['週日','週一','週二','週三','週四','週五','週六']; document.getElementById('weekdayDisplay').innerText = days[new Date(e.target.value).getDay()] || '--'; });
        document.getElementById('surgeryForm').addEventListener('submit', async function(e) {
            e.preventDefault(); const data = { id: document.getElementById('editId').value || Date.now().toString(), user: document.getElementById('userName').value, date: document.getElementById('surgeryDate').value, weekday: document.getElementById('weekdayDisplay').innerText, hospital: document.getElementById('hospitalName').value, cases: "1", he: document.getElementById('heGas').value, ar1: document.getElementById('ar1Gas').value, ar2: document.getElementById('ar2Gas').value, he2: document.getElementById('he2Gas').value, ar3: document.getElementById('ar3Gas').value, status: 'pending' };
            await saveToCloud(data); loadSchedulesFromCloud(); resetForm();
        });
    }
    function toggleHistory() { document.getElementById('historyList').classList.toggle('hidden'); document.getElementById('historyIcon').style.transform = document.getElementById('historyList').classList.contains('hidden') ? 'rotate(0deg)' : 'rotate(180deg)'; }
    function closeMonitorModal() { document.getElementById('monitor-modal').classList.add('hidden'); }
    function switchPage(pageID) { document.querySelectorAll('.page-content').forEach(el => el.classList.remove('page-active')); document.getElementById('page-' + pageID).classList.add('page-active'); document.querySelectorAll('.nav-box').forEach(btn => btn.classList.remove('nav-box-active', 'desktop-nav-active')); const activeBtn = document.getElementById('nav-' + pageID); activeBtn.classList.add('nav-box-active'); if (window.innerWidth >= 1024) activeBtn.classList.add('desktop-nav-active'); safeLucide(); window.scrollTo(0,0); }
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GAS 戰情監控中心 v5.0.0</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/lucide/0.263.0/lucide.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Noto+Sans+TC:wght@400;700;900&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet">
    <style>
        :root { --bg-light: #f1f5f9; }
        body { font-family: 'Inter', 'Noto Sans TC', sans-serif; background-color: var(--bg-light); color: #1e293b; min-height: 100vh; overflow-x: hidden; }
        .nav-active { background: #2563eb !important; color: white !important; }
        .page-content { display: none; animation: fadeIn 0.4s ease-out forwards; height: 100%; }
        .page-active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.1); border-radius: 10px; }
        
        /* 🎨 鋼瓶卡片淡色系區分 */
        .bg-ar-light { background-color: #f0f7ff; border: 1px solid #e0efff; } /* 淡藍 (Ar) */
        .bg-he-light { background-color: #fdf2ff; border: 1px solid #f5e1ff; } /* 淡紫 (He) */
        
        .ana-reg-btn-active { background-color: #1e293b !important; color: white !important; border-color: #3b82f6 !important; }
    </style>
</head>
<body class="flex flex-col lg:flex-row h-screen overflow-hidden text-lg">

    <aside class="lg:w-72 w-full lg:h-screen bg-white border-r border-slate-200 p-6 flex flex-col z-50">
        <div class="mb-10 text-center lg:text-left">
            <h1 class="text-3xl font-black italic tracking-tighter text-slate-900 uppercase leading-none">Gas Command</h1>
            <p class="text-[10px] text-blue-600 font-bold tracking-widest uppercase mt-2">v5.0.0 Perfect Sync</p>
        </div>
        <nav class="space-y-4 flex-1">
            <button onclick="switchPage('monitor')" id="nav-monitor" class="nav-active w-full flex items-center gap-4 px-5 py-4 rounded-xl text-base font-bold transition-all"><i data-lucide="layout-dashboard"></i> 即時存量監控</button>
            <button onclick="switchPage('schedule')" id="nav-schedule" class="w-full flex items-center gap-4 px-5 py-4 rounded-xl text-base font-bold text-slate-500 hover:bg-slate-100 transition-all"><i data-lucide="calendar-range"></i> 北區備刀排程</button>
            <button onclick="switchPage('analysis')" id="nav-analysis" class="w-full flex items-center gap-4 px-5 py-4 rounded-xl text-base font-bold text-slate-500 hover:bg-slate-100 transition-all"><i data-lucide="bar-chart-3"></i> 數據分析中心</button>
        </nav>
    </aside>

    <main class="flex-1 overflow-hidden p-6 lg:p-12">
        <section id="page-monitor" class="page-content page-active">
            <header class="flex justify-between items-end mb-10">
                <div><h2 class="text-6xl font-black italic text-slate-900 uppercase tracking-tighter">Live Status</h2><p class="text-blue-600 text-sm font-bold tracking-widest mt-3 uppercase">全台鋼瓶最新存量監控</p></div>
                <div class="flex gap-2 bg-white p-1.5 rounded-xl border border-slate-200 shadow-sm">
                    <button onclick="filterRegion('ALL')" class="reg-btn px-6 py-2 rounded-lg text-sm font-bold bg-blue-600 text-white">全域</button>
                    <button onclick="filterRegion('北區')" class="reg-btn px-6 py-2 rounded-lg text-sm font-bold text-slate-500">北區</button>
                    <button onclick="filterRegion('中區')" class="reg-btn px-6 py-2 rounded-lg text-sm font-bold text-slate-500">中區</button>
                    <button onclick="filterRegion('南區')" class="reg-btn px-6 py-2 rounded-lg text-sm font-bold text-slate-500">南區</button>
                </div>
            </header>
            <div id="monitor-grid" class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-8 overflow-y-auto max-h-[calc(100vh-250px)] custom-scrollbar pb-20"></div>
        </section>

        <section id="page-analysis" class="page-content">
            <header class="mb-8">
                <h2 class="text-6xl font-black italic text-slate-900 uppercase tracking-tighter">Analytics</h2>
                <p class="text-blue-600 text-sm font-bold tracking-widest mt-3 uppercase">全台勤務分布與換氣數據分析</p>
            </header>
            <div class="grid grid-cols-3 gap-4 mb-8">
                <button onclick="updateAnalysisRegion('北區')" class="ana-reg-btn py-6 bg-white text-slate-400 rounded-2xl font-black italic border border-slate-200 transition-all ana-reg-btn-active">北區分析</button>
                <button onclick="updateAnalysisRegion('中區')" class="ana-reg-btn py-6 bg-white text-slate-400 rounded-2xl font-black italic border border-slate-200 transition-all">中區分析</button>
                <button onclick="updateAnalysisRegion('南區')" class="ana-reg-btn py-6 bg-white text-slate-400 rounded-2xl font-black italic border border-slate-200 transition-all">南區分析</button>
            </div>
            <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
                <div class="bg-white p-8 rounded-[2.5rem] border border-slate-100 shadow-sm">
                    <h3 class="text-xl font-black text-slate-800 mb-6 italic border-b pb-4">📋 2026 勤務頻次統計 (備刀)</h3>
                    <div id="ana-hospital-list" class="space-y-3 overflow-y-auto max-h-[400px] custom-scrollbar pr-2"></div>
                </div>
                <div class="bg-white p-8 rounded-[2.5rem] border border-slate-100 shadow-sm flex flex-col justify-center min-h-[400px]">
                    <h3 class="text-xl font-black text-slate-800 mb-12 italic text-center leading-none">📉 平均換氣壓力 (PSI)</h3>
                    <div class="flex justify-around items-center">
                        <div class="text-center">
                            <p class="text-xs font-bold text-blue-500 uppercase mb-4 tracking-widest">Argon (Ar)</p>
                            <p id="ana-ar-psi" class="text-7xl font-black text-slate-900 font-mono italic">--</p>
                        </div>
                        <div class="w-px h-24 bg-slate-100"></div>
                        <div class="text-center">
                            <p class="text-xs font-bold text-purple-500 uppercase mb-4 tracking-widest">Helium (He)</p>
                            <p id="ana-he-psi" class="text-7xl font-black text-slate-900 font-mono italic">--</p>
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <section id="page-schedule" class="page-content">
            <div class="grid grid-cols-1 lg:grid-cols-12 gap-10">
                <div class="lg:col-span-4">
                    <div class="bg-white p-8 rounded-[2.5rem] border border-slate-200 shadow-sm">
                        <h3 id="formTitle" class="text-3xl font-black mb-6 text-blue-600 italic">Add Schedule</h3>
                        <div class="form-container custom-scrollbar">
                            <form id="surgeryForm" class="space-y-4 pr-1">
                                <input type="hidden" id="editId">
                                <div><label class="text-xs font-bold text-slate-400 block mb-1 uppercase tracking-widest">負責人</label><select id="userName" required class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-base outline-none"></select></div>
                                <div class="grid grid-cols-2 gap-4">
                                    <div class="date-input-wrapper"><label class="text-xs font-bold text-slate-400 block mb-1 uppercase tracking-widest">日期</label><input type="date" id="surgeryDate" required class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-base outline-none"></div>
                                    <div><label class="text-xs font-bold text-slate-400 block mb-1 uppercase tracking-widest">星期</label><div id="weekdayDisplay" class="py-3 px-4 text-blue-600 font-black text-base bg-blue-50 rounded-xl text-center">--</div></div>
                                </div>
                                <div><label class="text-xs font-bold text-slate-400 block mb-1 uppercase tracking-widest">醫院名稱</label><select id="hospitalName" required class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-base outline-none"></select></div>
                                <div><label class="text-xs font-bold text-slate-400 block mb-1 uppercase tracking-widest">台數</label><select id="casesCount" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-base outline-none"><option value="1">1 台</option><option value="2">2 台</option><option value="3">3 台</option></select></div>
                                <div class="p-6 bg-blue-50 rounded-3xl border border-blue-100 space-y-4">
                                    <div class="grid grid-cols-2 gap-4">
                                        <div class="space-y-1"><span class="text-xs text-blue-500 font-black uppercase">He 氦氣</span><select id="heGas" class="gas-sel w-full bg-white border border-blue-200 rounded-lg px-2 py-2 text-sm font-mono"></select></div>
                                        <div class="space-y-1"><span class="text-xs text-blue-500 font-black uppercase">Ar1 氬氣</span><select id="ar1Gas" class="gas-sel w-full bg-white border border-blue-200 rounded-lg px-2 py-2 text-sm font-mono"></select></div>
                                    </div>
                                    <div class="space-y-1"><span class="text-xs text-slate-400 font-bold uppercase">Ar2 (選填)</span><select id="ar2Gas" class="gas-sel w-full bg-white border border-slate-200 rounded-lg px-2 py-2 text-sm font-mono"><option value="">無</option></select></div>
                                </div>
                                <div class="space-y-3 pt-4">
                                    <button type="submit" id="submitBtn" class="w-full py-5 bg-blue-600 rounded-2xl font-black text-white text-sm tracking-[0.2em] hover:bg-blue-700 shadow-md uppercase italic transition-all">Confirm Task</button>
                                    <div id="editControls" class="hidden flex flex-col gap-3">
                                        <div class="flex gap-2">
                                            <button type="button" onclick="completeSelected()" class="flex-1 py-4 bg-green-500 text-white rounded-2xl font-black text-xs uppercase">Mark Done</button>
                                            <button type="button" onclick="cancelSelected()" class="flex-1 py-4 bg-red-100 text-red-600 border border-red-200 rounded-2xl font-black text-xs uppercase">Cancel Task</button>
                                        </div>
                                        <button type="button" onclick="resetForm()" class="w-full py-2 text-slate-400 text-xs font-bold uppercase italic hover:underline">Cancel Edit</button>
                                    </div>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
                <div class="lg:col-span-8">
                    <div id="scheduleGrid" class="list-container custom-scrollbar space-y-4 pb-20"></div>
                </div>
            </div>
        </section>
    </main>

    <div id="monitor-modal" class="fixed inset-0 z-[100] hidden flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-md">
        <div class="bg-white w-full max-w-2xl rounded-[2.5rem] p-10 relative border border-slate-200 shadow-2xl">
            <button onclick="closeMonitorModal()" class="absolute top-8 right-8 text-slate-400 hover:text-slate-600"><i data-lucide="x" class="w-8 h-8"></i></button>
            <div id="monitor-modal-content"></div>
        </div>
    </div>

    <script>
        const SPREADSHEET_ID = '1Vp78y7ACG9wx3RxtAwW-s4YE9l2Ml-hcUjQ2W7QLpXU';
        const API_KEY = 'AIzaSyCQzF6JI8Oa9VsiWq5Qgg56nDX6AtXk_18'; 
        const GAS_WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbyhq3KFBvN-HQzb1eeIx2Bdg_6ZyFJMr4KxJbKajzkSMxMMZNwDHI4koSALFD6wz5d6kA/exec'; 

        const USERS = ["杜孟擇", "張家榮"];
        const HOSPITALS = ["三軍總醫院", "國立臺灣大學醫學院附設醫院", "長庚醫療財團法人林口長庚紀念醫院", "國泰綜合醫院", "醫療財團法人羅許基金會羅東博愛醫院", "新竹臺大分院新竹醫院", "佛教慈濟醫療財團法人台北慈濟醫院", "基隆長庚紀念醫院", "汐止國泰綜合醫院", "新光醫療財團法人新光吳火獅紀念醫院", "佛教慈濟醫療財團法人花蓮慈濟醫院", "臺北榮總醫院", "衛生福利部雙和醫院", "天主教輔仁大學附設醫院", "新竹國泰綜合醫院", "淡水馬偕紀念醫院", "學術會"];
        
        let latestMonitorData = []; 
        let historicalRows = []; 
        let localSchedules = []; 
        let currentMonitorFilter = 'ALL';

        function safeLucide() { if (window.lucide) window.lucide.createIcons(); }

        window.onload = async () => { 
            initForms(); 
            await fetchMonitorData(); 
            await loadSchedulesFromCloud(); 
            await preLoadHistoricalData(); 
            updateAnalysisRegion('北區');
            safeLucide(); 
        };

        // --- 📊 數據與分析功能 ---
        async function fetchMonitorData() {
            const url = `https://sheets.googleapis.com/v4/spreadsheets/${SPREADSHEET_ID}/values/紀錄!A2:L2000?key=${API_KEY}`;
            try {
                const res = await fetch(url); const data = await res.json();
                if (data.values) {
                    const map = new Map();
                    data.values.forEach(row => {
                        if (row[2]) map.set(row[2], {
                            gas: row[2], region: row[3], standbyDate: row[4], location: row[5], reason: row[6], pressure: parseInt(row[7]) || 0, user: row[1], time: row[0], ar2: row[8] ? parseInt(row[8]) : null
                        });
                    });
                    latestMonitorData = Array.from(map.values()).sort((a,b) => {
                        const getVal = s => { const m = s.match(/([a-zA-Z]+)(\d+)/); return m ? [m[1], parseInt(m[2])] : [s, 0]; };
                        const [pA, nA] = getVal(a.gas); const [pB, nB] = getVal(b.gas);
                        return pA !== pB ? pA.localeCompare(pB) : nA - nB;
                    });
                    renderMonitorCards();
                }
            } catch (e) { console.error(e); }
        }

        async function preLoadHistoricalData() {
            const url = `https://sheets.googleapis.com/v4/spreadsheets/${SPREADSHEET_ID}/values/紀錄!A2:H3000?key=${API_KEY}`;
            try {
                const response = await fetch(url);
                const result = await response.json();
                historicalRows = result.values || [];
            } catch (e) { console.error(e); }
        }

        function renderMonitorCards() {
            const grid = document.getElementById('monitor-grid');
            const filtered = currentMonitorFilter === 'ALL' ? latestMonitorData : latestMonitorData.filter(d => d.region === currentMonitorFilter);
            grid.innerHTML = filtered.map(item => {
                const isAr = item.gas.toLowerCase().startsWith('ar');
                const bgColor = isAr ? 'bg-ar-light' : 'bg-he-light';
                const isCrit = item.pressure < 3000;
                const pct = Math.min((item.pressure / 6000) * 100, 100);
                return `
                <div onclick="showMonitorDetail('${item.gas}')" class="${bgColor} p-6 rounded-[2rem] cursor-pointer shadow-sm hover:shadow-md transition-all relative overflow-hidden">
                    <div class="flex justify-between items-start mb-4">
                        <div class="space-y-0.5">
                            <span class="text-[10px] font-black text-slate-400 uppercase tracking-widest leading-none">${item.region} | ${item.location}</span>
                            <h3 class="text-4xl font-black text-slate-800 italic leading-none">${item.gas}</h3>
                        </div>
                        <i data-lucide="activity" class="${isCrit ? 'text-red-500 animate-pulse' : 'text-blue-500'} w-6 h-6"></i>
                    </div>
                    <div class="text-4xl font-mono font-black text-slate-900 mb-3">${item.pressure.toLocaleString()} <span class="text-sm text-slate-400 italic font-sans">PSI</span></div>
                    <div class="w-full h-2 bg-white rounded-full overflow-hidden mb-4"><div class="h-full ${isCrit ? 'bg-red-500' : 'bg-blue-600'}" style="width: ${pct}%"></div></div>
                    <div class="grid grid-cols-2 gap-2 pt-3 border-t border-slate-200/50">
                        <div class="text-[10px]"><p class="text-slate-400 font-bold uppercase leading-none">人名</p><p class="text-slate-700 font-black">${item.user}</p></div>
                        <div class="text-[10px]"><p class="text-slate-400 font-bold uppercase leading-none">原因</p><p class="text-blue-600 font-black">${item.reason}</p></div>
                        <div class="text-[10px] col-span-2 mt-1"><p class="text-slate-400 font-bold uppercase leading-none">備刀日期</p><p class="text-slate-700 font-black">${item.standbyDate || '無'}</p></div>
                    </div>
                </div>`;
            }).join('');
            safeLucide();
        }

        function showMonitorDetail(gasName) {
            const item = latestMonitorData.find(d => d.gas === gasName);
            if (!item) return;

            // 🚀 抓取最近 5 筆紀錄
            const history = historicalRows.filter(r => r[2] === gasName)
                                         .slice(-5).reverse();

            let historyHtml = history.map(h => `
                <div class="flex justify-between items-center py-2 border-b border-slate-50 last:border-0">
                    <div class="text-xs">
                        <p class="font-black text-slate-700">${h[6]} @ ${h[5]}</p>
                        <p class="text-slate-400">${h[0]}</p>
                    </div>
                    <div class="text-sm font-mono font-black text-blue-600">${h[7]} PSI</div>
                </div>
            `).join('');

            document.getElementById('monitor-modal-content').innerHTML = `
                <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
                    <div>
                        <div class="flex items-center gap-4 mb-6">
                            <div class="p-4 bg-blue-50 rounded-2xl text-blue-600 border border-blue-100 shadow-sm"><i data-lucide="database" class="w-8 h-8"></i></div>
                            <div><h2 class="text-4xl font-black text-slate-800 italic uppercase leading-none">${item.gas}</h2><p class="text-blue-600 font-bold text-xs uppercase mt-1">${item.region} | ${item.location}</p></div>
                        </div>
                        <div class="space-y-6">
                            <div><p class="text-xs font-black text-slate-400 uppercase italic mb-1 leading-none">當前主壓力</p><p class="text-6xl font-black text-slate-900 font-mono italic leading-none">${item.pressure.toLocaleString()} <span class="text-lg italic text-slate-300">PSI</span></p></div>
                            <div class="bg-slate-50 p-4 rounded-2xl border border-slate-100 text-sm font-black italic text-blue-600 leading-tight">${item.reason || '無備註'}</div>
                            <div class="flex justify-between text-[10px] text-slate-400 font-mono uppercase"><span>Sync: ${item.user}</span><span>${item.time}</span></div>
                        </div>
                    </div>
                    <div class="bg-slate-50 p-6 rounded-[2rem] border border-slate-200">
                        <h3 class="text-xs font-black text-slate-400 uppercase mb-4 tracking-widest italic">📜 最近 5 筆歷史軌跡</h3>
                        <div class="space-y-1">${historyHtml || '<p class="text-xs text-slate-300">尚無歷史數據</p>'}</div>
                    </div>
                </div>
                <button onclick="closeMonitorModal()" class="w-full mt-10 py-5 bg-slate-800 text-white rounded-[2rem] font-black text-sm tracking-[0.4em] hover:bg-slate-900 transition-all uppercase italic">Close</button>
            `;
            document.getElementById('monitor-modal').classList.remove('hidden'); safeLucide();
        }

        // --- 📊 分析頁面更新 ---
        function updateAnalysisRegion(region) {
            document.querySelectorAll('.ana-reg-btn').forEach(btn => {
                if(btn.innerText.includes(region)) btn.classList.add('ana-reg-btn-active');
                else btn.classList.remove('ana-reg-btn-active');
            });
            const hospitalCount = {};
            let arTotal = 0, arCount = 0, heTotal = 0, heCount = 0;
            historicalRows.forEach(row => {
                const time = row[0] || "", gasID = row[2] || "", reg = row[3] || "", hospital = row[5] || "", reason = row[6] || "", psi = parseInt(row[7]) || 0;
                if (reg === region) {
                    if (time.includes("2026") && hospital) hospitalCount[hospital] = (hospitalCount[hospital] || 0) + 1;
                    if (reason === "待灌氣") {
                        if (gasID.toLowerCase().startsWith("ar")) { arTotal += psi; arCount++; }
                        else if (gasID.toLowerCase().startsWith("he")) { heTotal += psi; heCount++; }
                    }
                }
            });
            const listArea = document.getElementById('ana-hospital-list');
            const sorted = Object.entries(hospitalCount).sort((a,b) => b[1] - a[1]);
            listArea.innerHTML = sorted.length > 0 ? sorted.map(([name, count]) => `
                <div class="flex justify-between items-center bg-slate-50 p-4 rounded-xl border border-slate-100"><span class="font-bold text-slate-700">${name}</span><span class="bg-blue-600 text-white px-4 py-1 rounded-full text-xs font-black italic">${count} VISITS</span></div>
            `).join('') : '<p class="text-slate-400 text-center py-10">2026 尚無紀錄</p>';
            document.getElementById('ana-ar-psi').innerText = arCount > 0 ? Math.round(arTotal/arCount) : "--";
            document.getElementById('ana-he-psi').innerText = heCount > 0 ? Math.round(heTotal/heCount) : "--";
        }

        // --- 📡 其餘功能保持不變 ---
        function switchPage(p) { document.querySelectorAll('.page-content').forEach(el => el.classList.remove('page-active')); document.getElementById('page-'+p).classList.add('page-active'); document.querySelectorAll('nav button').forEach(b => b.classList.remove('nav-active')); document.getElementById('nav-'+p).classList.add('nav-active'); safeLucide(); }
        function filterRegion(r) { currentMonitorFilter = r; document.querySelectorAll('.reg-btn').forEach(b => b.classList.toggle('bg-blue-600', b.innerText.includes(r) || (r==='ALL' && b.innerText==='全域'))); document.querySelectorAll('.reg-btn').forEach(b => b.classList.toggle('text-white', b.classList.contains('bg-blue-600'))); renderMonitorCards(); }
        function closeMonitorModal() { document.getElementById('monitor-modal').classList.add('hidden'); }
        async function loadSchedulesFromCloud() {
            const url = `https://sheets.googleapis.com/v4/spreadsheets/${SPREADSHEET_ID}/values/備刀紀錄!A2:J2000?key=${API_KEY}`;
            try { const res = await fetch(url); const data = await res.json(); if (data.values) { localSchedules = data.values.map(r => ({ id: parseInt(r[0]), date: r[1], weekday: r[2], hospital: r[3], user: r[4], cases: r[5], he: r[6], ar1: r[7], ar2: r[8], status: r[9] })); renderScheduleList(); } } catch (e) { console.error(e); }
        }
        function renderScheduleList() {
            const grid = document.getElementById('scheduleGrid'); const now = new Date(); now.setHours(0,0,0,0);
            const sorted = [...localSchedules].sort((a, b) => new Date(a.date) - new Date(b.date));
            const alerts = sorted.filter(s => new Date(s.date) < now && s.status === 'pending');
            const active = sorted.filter(s => new Date(s.date) >= now && s.status === 'pending');
            const archive = sorted.filter(s => (s.status === 'done' || s.status === 'cancelled') && (new Date() - new Date(s.date)) / (1000*60*60*24) <= 7);
            let html = '';
            if(alerts.length > 0) html += `<div class="mb-4"><h4 class="text-sm font-black text-amber-600 uppercase mb-3">⚠️ 逾期未處理</h4>` + alerts.map(i => getItemHtml(i, 'status-alert')).join('') + `</div>`;
            html += `<div class="mb-4"><h4 class="text-sm font-black text-slate-400 uppercase mb-3">📅 預定備刀</h4>` + (active.length > 0 ? active.map(i => getItemHtml(i)).join('') : `<div class="text-base text-slate-300 italic py-10 text-center">目前無任務</div>`) + `</div>`;
            if(archive.length > 0) html += `<div class="mt-12 border-t border-slate-200 pt-6"><button onclick="toggleArchive()" class="w-full py-4 bg-slate-100 rounded-2xl text-sm font-black text-slate-500 uppercase flex justify-between px-6"><span>顯示 7 天內歷史紀錄</span><i data-lucide="chevron-down"></i></button><div id="archiveContent" class="hidden space-y-4 mt-6">` + archive.map(i => getItemHtml(i, i.status === 'done' ? 'status-done' : 'status-cancelled')).join('') + `</div></div>`;
            grid.innerHTML = html; safeLucide();
        }
        function getItemHtml(item, customClass = '') {
            let badge = item.status === 'done' ? `<span class="bg-green-100 text-green-600 px-3 py-1 rounded-lg text-xs font-black italic">DONE</span>` : (item.status === 'cancelled' ? `<span class="bg-red-100 text-red-600 px-3 py-1 rounded-lg text-xs font-black italic">CANCELLED</span>` : '');
            return `<div onclick="editSchedule(${item.id})" class="item-row bg-white p-6 rounded-[2rem] border border-slate-100 flex flex-col md:flex-row items-center gap-6 cursor-pointer shadow-sm ${customClass} transition-all"><div class="flex flex-col items-center justify-center min-w-[100px] border-r border-slate-100 pr-6"><span class="text-blue-500 font-black text-xs uppercase mb-2">${item.weekday}</span><span class="text-slate-900 font-mono font-black text-2xl leading-none">${item.date.slice(5)}</span></div><div class="flex-1 text-center md:text-left"><div class="flex items-center gap-3 justify-center md:justify-start mb-2"><h4 class="text-2xl font-black text-slate-800 uppercase italic leading-none">${item.hospital}</h4>${badge}</div><div class="text-xs font-bold text-slate-400 font-mono">User: ${item.user} | Cases: ${item.cases}</div></div><div class="flex gap-3"><div class="bg-blue-50 border border-blue-100 px-6 py-3 rounded-2xl text-center"><p class="text-[10px] font-black text-blue-500 italic mb-1">HE</p><p class="text-2xl font-black text-slate-800 font-mono leading-none">${item.he}</p></div><div class="bg-slate-50 border border-slate-100 px-6 py-3 rounded-2xl text-center"><p class="text-[10px] font-black text-slate-500 italic mb-1">AR1</p><p class="text-2xl font-black text-slate-800 font-mono leading-none">${item.ar1}</p></div></div></div>`;
        }
        function initForms() {
            const uSel = document.getElementById('userName'); const hSel = document.getElementById('hospitalName'); const gSels = document.querySelectorAll('.gas-sel');
            USERS.forEach(u => uSel.add(new Option(u, u))); HOSPITALS.forEach(h => hSel.add(new Option(h, h)));
            for(let v=6000; v>=2500; v-=100) gSels.forEach(s => s.add(new Option(v+' PSI', v)));
            document.getElementById('surgeryDate').addEventListener('input', (e) => { const days = ['週日','週一','週二','週三','週四','週五','週六']; document.getElementById('weekdayDisplay').innerText = days[new Date(e.target.value).getDay()] || '--'; });
            document.getElementById('surgeryForm').addEventListener('submit', async function(e) { e.preventDefault(); const btn = document.getElementById('submitBtn'); btn.disabled = true; btn.innerText = "SYNCING..."; const editId = document.getElementById('editId').value; const data = { id: editId ? parseInt(editId) : Date.now(), user: document.getElementById('userName').value, date: document.getElementById('surgeryDate').value, weekday: document.getElementById('weekdayDisplay').innerText, hospital: document.getElementById('hospitalName').value, cases: document.getElementById('casesCount').value, he: document.getElementById('heGas').value, ar1: document.getElementById('ar1Gas').value, ar2: document.getElementById('ar2Gas').value || '無', status: 'pending' }; const success = await saveToCloud(data); if (success) { if (editId) { const idx = localSchedules.findIndex(s => s.id === data.id); localSchedules[idx] = data; } else { localSchedules.push(data); } resetForm(); renderScheduleList(); } btn.disabled = false; btn.innerText = "Confirm Task"; alert("指令已發送！"); });
        }
        async function saveToCloud(payload) { try { fetch(GAS_WEB_APP_URL, { method: "POST", mode: "no-cors", cache: "no-cache", headers: { "Content-Type": "text/plain" }, body: JSON.stringify({ action: "saveSchedule", data: payload }) }); return true; } catch (e) { return false; } }
        function resetForm() { document.getElementById('surgeryForm').reset(); document.getElementById('editId').value = ''; document.getElementById('formTitle').innerText = "Add Schedule"; document.getElementById('editControls').classList.add('hidden'); document.getElementById('submitBtn').classList.remove('hidden'); }
        async function completeSelected() { if(confirm('確認完工？')) { const id = parseInt(document.getElementById('editId').value); const item = localSchedules.find(s => s.id === id); item.status = 'done'; await saveToCloud(item); resetForm(); renderScheduleList(); } }
        async function cancelSelected() { if(confirm('確定取消？')) { const id = parseInt(document.getElementById('editId').value); const item = localSchedules.find(s => s.id === id); item.status = 'cancelled'; await saveToCloud(item); resetForm(); renderScheduleList(); } }
        function toggleArchive() { const content = document.getElementById('archiveContent'); content.classList.toggle('hidden'); }
    </script>
</body>
</html>

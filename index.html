<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GAS 戰情中心 v6.0.2</title>
    <link rel="icon" href="data:,"> 
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/lucide/0.263.0/lucide.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Noto+Sans+TC:wght@400;700;900&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet">
    <style>
        :root { --bg-light: #f8fafc; }
        body { font-family: 'Inter', 'Noto Sans TC', sans-serif; background-color: var(--bg-light); color: #1e293b; min-height: 100vh; margin: 0; padding: 0; }
        
        /* 🎨 科技玻璃美學 */
        .glass-card-ar { background: rgba(224, 242, 254, 0.95); backdrop-filter: blur(12px); border: 2px solid #bae6fd; }
        .glass-card-he { background: rgba(245, 243, 255, 0.95); backdrop-filter: blur(12px); border: 2px solid #ddd6fe; }
        
        /* 📱 手機導覽修正 */
        @media (max-width: 1023px) {
            .mobile-grid-nav { display: flex !important; position: sticky; top: 0; z-index: 100; padding: 10px; gap: 8px; background: white; border-bottom: 1px solid #e2e8f0; }
            .nav-box { flex: 1 !important; text-align: center; border: 1px solid #cbd5e1; border-radius: 12px; padding: 12px 0; font-size: 14px; font-weight: 900; color: #64748b; background: #f1f5f9; }
            .nav-box-active { background: #2563eb !important; color: white !important; border-color: #2563eb !important; box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3); }
            body { overflow-y: auto !important; }
        }

        .desktop-nav-active { background: #2563eb !important; color: white !important; box-shadow: 0 4px 12px rgba(37, 99, 235, 0.2); }
        .page-content { display: none !important; }
        .page-active { display: flex !important; animation: fadeIn 0.2s ease-out; }
        
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .custom-scrollbar::-webkit-scrollbar { width: 5px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.1); border-radius: 10px; }
        
        input[type="date"]::-webkit-calendar-picker-indicator { position: absolute; left: 0; top: 0; width: 100%; height: 100%; margin: 0; padding: 0; cursor: pointer; opacity: 0; }
        .date-container { position: relative; }
    </style>
</head>
<body class="flex flex-col lg:flex-row">

    <aside class="lg:w-64 w-full bg-white lg:border-r border-slate-200 flex flex-col z-[100] shadow-sm lg:h-screen lg:sticky lg:top-0">
        <div class="p-6 text-center lg:text-left hidden lg:block">
            <h1 class="text-2xl font-black italic tracking-tighter text-slate-950 uppercase leading-none">Gas Command</h1>
            <p class="text-[10px] text-blue-600 font-black tracking-[0.3em] uppercase mt-1">v6.0.2 Sync Perfected</p>
        </div>
        <nav class="mobile-grid-nav lg:flex-col lg:p-6 lg:space-y-3">
            <button onclick="switchPage('monitor')" id="nav-monitor" class="nav-box nav-box-active lg:w-full lg:flex lg:items-center lg:gap-3 lg:px-5 lg:py-4 lg:rounded-xl lg:text-base">即時監控</button>
            <button onclick="switchPage('schedule')" id="nav-schedule" class="nav-box lg:w-full lg:flex lg:items-center lg:gap-3 lg:px-5 lg:py-4 lg:rounded-xl lg:text-base">備刀排程</button>
            <button onclick="switchPage('analysis')" id="nav-analysis" class="nav-box lg:w-full lg:flex lg:items-center lg:gap-3 lg:px-5 lg:py-4 lg:rounded-xl lg:text-base">數據分析</button>
        </nav>
    </aside>

    <main class="flex-1 p-4 lg:p-10 relative">
        <section id="page-monitor" class="page-content page-active flex-col">
            <header class="flex flex-col md:flex-row justify-between items-start md:items-end mb-8 gap-3">
                <div><h2 class="text-5xl lg:text-7xl font-black italic text-slate-900 uppercase tracking-tighter leading-none">Live Status</h2></div>
                <div class="flex gap-1 bg-white p-1 rounded-xl border border-slate-200 shadow-sm">
                    <button onclick="filterRegion('ALL')" class="reg-btn px-6 py-2 rounded-lg text-xs font-black bg-blue-600 text-white">全域</button>
                    <button onclick="filterRegion('北區')" class="reg-btn px-6 py-2 rounded-lg text-xs font-black text-slate-500">北區</button>
                    <button onclick="filterRegion('中區')" class="reg-btn px-6 py-2 rounded-lg text-xs font-black text-slate-500">中區</button>
                    <button onclick="filterRegion('南區')" class="reg-btn px-6 py-2 rounded-lg text-xs font-black text-slate-500">南區</button>
                </div>
            </header>
            <div id="monitor-grid" class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-6 pb-20"></div>
        </section>

        <section id="page-analysis" class="page-content flex-col">
            <header class="mb-10"><h2 class="text-5xl lg:text-7xl font-black italic text-slate-900 uppercase tracking-tighter">Analytics</h2></header>
            <div class="grid grid-cols-3 gap-3 mb-8">
                <button onclick="updateAnalysisRegion('北區')" class="ana-reg-btn py-5 bg-slate-900 text-white rounded-2xl font-black italic border-2 border-blue-500">北區分析</button>
                <button onclick="updateAnalysisRegion('中區')" class="ana-reg-btn py-5 bg-white text-slate-400 rounded-2xl font-black italic border border-slate-200">中區分析</button>
                <button onclick="updateAnalysisRegion('南區')" class="ana-reg-btn py-5 bg-white text-slate-400 rounded-2xl font-black italic border border-slate-200">南區分析</button>
            </div>
            <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
                <div class="bg-white p-8 rounded-[2.5rem] border border-slate-100"><h3 class="text-2xl font-black text-slate-900 mb-6 italic border-b-2 pb-3">📋 勤務次數統計</h3><div id="ana-hospital-list" class="space-y-2"></div></div>
                <div class="bg-white p-8 rounded-[2.5rem] border border-slate-100 flex flex-col justify-center min-h-[400px]"><h3 class="text-2xl font-black text-slate-900 mb-10 italic text-center uppercase tracking-tighter">📉 平均換氣壓力</h3>
                    <div class="flex justify-around items-center">
                        <div class="text-center"><p class="text-sm font-black text-blue-500 uppercase mb-4 tracking-widest">Argon (Ar)</p><p id="ana-ar-psi" class="text-7xl font-black text-slate-950 font-mono italic">--</p></div>
                        <div class="w-px h-24 bg-slate-100"></div>
                        <div class="text-center"><p class="text-sm font-black text-purple-500 uppercase mb-4 tracking-widest">Helium (He)</p><p id="ana-he-psi" class="text-7xl font-black text-slate-950 font-mono italic">--</p></div>
                    </div>
                </div>
            </div>
        </section>

        <section id="page-schedule" class="page-content flex-col">
            <header class="mb-8"><h2 class="text-5xl lg:text-7xl font-black italic text-slate-900 uppercase tracking-tighter">Schedule</h2></header>
            <div class="grid grid-cols-1 lg:grid-cols-12 gap-8 overflow-y-auto">
                <div class="lg:col-span-4 h-fit">
                    <div class="bg-white p-6 rounded-[2rem] border border-slate-200 shadow-md">
                        <h3 id="formTitle" class="text-2xl font-black mb-6 text-blue-600 italic leading-none">Add Task</h3>
                        <form id="surgeryForm" class="space-y-4">
                            <input type="hidden" id="editId">
                            <div><label class="text-[10px] font-black text-slate-400 block mb-1 uppercase tracking-widest">負責人</label><select id="userName" required class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 font-bold text-base outline-none"></select></div>
                            <div class="grid grid-cols-2 gap-3">
                                <div class="date-container"><label class="text-[10px] font-black text-slate-400 block mb-1 uppercase tracking-widest">日期 (點選任一處)</label><input type="date" id="surgeryDate" required class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-3 text-sm font-bold outline-none"></div>
                                <div><label class="text-[10px] font-black text-slate-400 block mb-1 uppercase tracking-widest">星期</label><div id="weekdayDisplay" class="py-3 bg-blue-50 text-blue-700 font-black rounded-xl text-center text-base italic">--</div></div>
                            </div>
                            <div><label class="text-[10px] font-black text-slate-400 block mb-1 uppercase tracking-widest">目標醫院</label><select id="hospitalName" required class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 font-bold text-base outline-none"></select></div>
                            <div class="grid grid-cols-2 gap-3 pt-2 border-t border-slate-100">
                                <div class="bg-blue-50/50 p-3 rounded-xl"><span class="text-[9px] font-black text-blue-500 uppercase mb-1 block leading-none">HE 氦氣</span><select id="heGas" class="gas-sel w-full bg-transparent border-none font-black text-lg italic outline-none"></select></div>
                                <div class="bg-slate-50/50 p-3 rounded-xl"><span class="text-[9px] font-black text-slate-500 uppercase mb-1 block leading-none">AR1 氬氣</span><select id="ar1Gas" class="gas-sel w-full bg-transparent border-none font-black text-lg italic outline-none"></select></div>
                            </div>
                            <div class="bg-slate-50/30 p-3 rounded-xl"><span class="text-[9px] font-black text-slate-400 uppercase mb-1 block leading-none">AR2 (選填)</span><select id="ar2Gas" class="gas-sel w-full bg-transparent border-none font-black text-lg italic outline-none"><option value="無">無</option></select></div>
                            <button type="submit" id="submitBtn" class="w-full py-5 bg-blue-600 rounded-[1.5rem] font-black text-white text-sm tracking-[0.2em] uppercase italic shadow-lg active:scale-95 transition-all">Confirm Sync</button>
                            <div id="editControls" class="hidden space-y-3">
                                <button type="submit" class="w-full py-4 bg-blue-900 text-white rounded-2xl font-black text-sm uppercase italic shadow-lg">Update Sync (更新編輯)</button>
                                <div class="grid grid-cols-2 gap-2">
                                    <button type="button" onclick="completeTask()" class="py-4 bg-green-500 text-white rounded-2xl font-black text-xs uppercase">完工</button>
                                    <button type="button" onclick="cancelTask()" class="py-4 bg-red-500 text-white rounded-2xl font-black text-xs uppercase">取消</button>
                                </div>
                                <button type="button" onclick="resetForm()" class="w-full text-[10px] text-slate-400 font-bold uppercase py-2">放棄編輯</button>
                            </div>
                        </form>
                    </div>
                </div>
                <div class="lg:col-span-8 flex flex-col">
                    <div id="alertSection" class="mb-6 hidden">
                        <h4 class="text-[12px] font-black text-amber-600 uppercase mb-3 tracking-widest flex items-center gap-2"><i data-lucide="alert-triangle" class="w-4 h-4"></i> ⚠️ 逾期未結案</h4>
                        <div id="alertGrid" class="space-y-3"></div>
                    </div>
                    <h4 class="text-[12px] font-black text-slate-400 uppercase mb-4 tracking-widest flex items-center gap-2 border-b pb-2"><i data-lucide="calendar-range" class="w-4 h-4"></i> 📋 預定備刀排程</h4>
                    <div id="scheduleGrid" class="space-y-4"></div>
                    
                    <div class="mt-10 bg-slate-100/50 rounded-3xl border border-slate-200 overflow-hidden">
                        <button onclick="toggleHistory()" class="w-full p-5 flex justify-between items-center hover:bg-slate-100 transition-all">
                            <span class="text-[11px] font-black text-slate-500 uppercase tracking-[0.2em] flex items-center gap-3"><i data-lucide="history" class="w-4 h-4"></i> 最近 7 天紀錄清單</span>
                            <i id="historyIcon" data-lucide="chevron-down" class="w-5 h-5 text-slate-400 transition-transform"></i>
                        </button>
                        <div id="historyList" class="hidden p-5 pt-0 space-y-3 max-h-[500px] overflow-y-auto custom-scrollbar"></div>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <div id="monitor-modal" class="fixed inset-0 z-[200] hidden flex items-center justify-center p-4 bg-slate-900/50 backdrop-blur-md">
        <div class="bg-white/95 backdrop-blur-2xl w-full max-w-5xl max-h-[92vh] overflow-y-auto rounded-3xl p-6 lg:p-12 relative shadow-2xl border border-white/50 custom-scrollbar">
            <button onclick="closeMonitorModal()" class="absolute top-6 right-6 text-slate-400 hover:text-red-500 transition-all"><i data-lucide="x" class="w-8 h-8"></i></button>
            <div id="monitor-modal-content"></div>
        </div>
    </div>

    <script>
        const SPREADSHEET_ID = '1Vp78y7ACG9wx3RxtAwW-s4YE9l2Ml-hcUjQ2W7QLpXU';
        const API_KEY = 'AIzaSyCQzF6JI8Oa9VsiWq5Qgg56nDX6AtXk_18'; 
        const GAS_WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbyhq3KFBvN-HQzb1eeIx2Bdg_6ZyFJMr4KxJbKajzkSMxMMZNwDHI4koSALFD6wz5d6kA/exec'; 

        const USERS = ["杜孟擇", "張家榮"];
        const HOSPITALS = ["三軍總醫院", "國立臺灣大學醫學院附設醫院", "長庚醫療財團法人林口長庚紀念醫院", "國泰綜合醫院", "醫療財團法人羅許基金會羅東博愛醫院", "新竹臺大分院新竹醫院", "佛教慈濟醫療財團法人台北慈濟醫院", "基隆長庚紀念醫院", "汐止國泰綜合醫院", "新光醫療財團法人新光吳火獅紀念醫院", "佛教慈濟醫療財團法人花蓮慈濟醫院", "臺北榮總醫院", "衛生福利部雙和醫院", "天主教輔仁大學附設醫院", "新竹國泰綜合醫院", "淡水馬偕紀念醫院", "學術會"];
        
        let latestMonitorData = []; let historicalRows = []; let localSchedules = []; let currentMonitorFilter = 'ALL';

        function safeLucide() { if (window.lucide) window.lucide.createIcons(); }

        function switchPage(pageID) {
            document.querySelectorAll('.page-content').forEach(el => el.classList.remove('page-active'));
            document.getElementById('page-' + pageID).classList.add('page-active');
            document.querySelectorAll('.nav-box').forEach(btn => btn.classList.remove('nav-box-active', 'desktop-nav-active'));
            const activeBtn = document.getElementById('nav-' + pageID);
            activeBtn.classList.add('nav-box-active');
            if (window.innerWidth >= 1024) activeBtn.classList.add('desktop-nav-active');
            safeLucide();
            window.scrollTo(0,0);
        }

        window.onload = async () => { 
            initForms(); await fetchMonitorData(); await loadSchedulesFromCloud(); await preLoadHistoricalData(); 
            updateAnalysisRegion('北區'); safeLucide(); 
        };

        async function fetchMonitorData() {
            const url = `https://sheets.googleapis.com/v4/spreadsheets/${SPREADSHEET_ID}/values/紀錄!A2:L2000?key=${API_KEY}`;
            try {
                const res = await fetch(url); const data = await res.json();
                if (data.values) {
                    const map = new Map();
                    data.values.forEach(row => {
                        if (row[2]) map.set(row[2], { gas: row[2], region: row[3], standbyDate: row[4], location: row[5], reason: row[6], pressure: parseInt(row[7]) || 0, user: row[1], time: row[0] });
                    });
                    latestMonitorData = Array.from(map.values()).sort((a, b) => {
                        const getPrio = s => {
                            const m = s.match(/([a-zA-Z]+)(\d+)/);
                            if(!m) return [s, 0];
                            const prefix = m[1].toLowerCase() === 'ar' ? 1 : 2;
                            return [prefix, parseInt(m[2])];
                        };
                        const [pA, nA] = getPrio(a.gas); const [pB, nB] = getPrio(b.gas);
                        return pA !== pB ? pA - pB : nA - nB;
                    });
                    renderMonitorCards();
                }
            } catch (e) { console.error(e); }
        }

        async function preLoadHistoricalData() {
            const url = `https://sheets.googleapis.com/v4/spreadsheets/${SPREADSHEET_ID}/values/紀錄!A2:H3000?key=${API_KEY}`;
            try { const res = await fetch(url); const data = await res.json(); historicalRows = data.values || []; } catch (e) { console.error(e); }
        }

        function renderMonitorCards() {
            const grid = document.getElementById('monitor-grid');
            const filtered = currentMonitorFilter === 'ALL' ? latestMonitorData : latestMonitorData.filter(d => d.region === currentMonitorFilter);
            grid.innerHTML = filtered.map(item => {
                const isAr = item.gas.toLowerCase().startsWith('ar');
                const glassClass = isAr ? 'glass-card-ar' : 'glass-card-he';
                const pct = Math.min((item.pressure / 6000) * 100, 100);
                return `
                <div onclick="showMonitorDetail('${item.gas}')" class="${glassClass} p-5 rounded-[2.5rem] cursor-pointer active:scale-95 transition-all flex flex-col justify-between h-[320px] shadow-sm">
                    <div class="flex justify-between items-start">
                        <div class="space-y-1">
                            <h3 class="text-4xl font-black text-slate-900 italic leading-none">${item.gas}</h3>
                            <p class="text-lg font-black text-blue-800 uppercase leading-none mt-2 tracking-tighter">${item.region}</p>
                        </div>
                        <div class="text-right bg-white/70 p-3 rounded-2xl border border-white/80">
                            <p class="text-[10px] text-slate-500 font-black uppercase mb-1 leading-none tracking-widest">使用原因</p>
                            <p class="text-blue-900 font-black text-2xl italic leading-none mb-2 tracking-tighter">${item.reason}</p>
                            <p class="text-[10px] text-slate-500 font-black uppercase mb-1 leading-none tracking-widest">備刀日期</p>
                            <p class="text-slate-900 font-black text-base italic leading-none">${item.standbyDate || '無'}</p>
                        </div>
                    </div>
                    <div>
                        <div class="flex items-baseline gap-1 leading-none mb-2">
                            <span class="text-6xl font-mono font-black text-slate-950 italic tracking-tighter">${item.pressure.toLocaleString()}</span>
                            <span class="text-lg font-black text-slate-400 italic">PSI</span>
                        </div>
                        <div class="w-full h-3.5 bg-white/60 rounded-full overflow-hidden border border-white/40"><div class="h-full ${(item.pressure < 3000) ? 'bg-red-500 shadow-md' : 'bg-blue-600'}" style="width: ${pct}%"></div></div>
                        <p class="text-[15px] font-bold text-slate-600 mt-2 uppercase tracking-widest">📍 ${item.location || '未知區域'}</p>
                    </div>
                    <div class="flex justify-between items-end pt-3 border-t border-slate-900/10">
                        <div><p class="text-[11px] text-slate-500 font-black uppercase mb-1 leading-none">負責人</p><p class="text-slate-900 font-black text-xl leading-none tracking-tight">${item.user}</p></div>
                        <div class="text-right"><p class="text-[10px] text-slate-500 font-black mb-1 leading-none tracking-tighter uppercase">Sync Time</p><p class="text-slate-700 font-mono font-black text-[10px] leading-none">${item.time}</p></div>
                    </div>
                </div>`;
            }).join('');
            safeLucide();
        }

        function showMonitorDetail(gasName) {
            const item = latestMonitorData.find(d => d.gas === gasName); if (!item) return;
            const history = historicalRows.filter(r => r[2] === gasName).slice(-5).reverse();
            let historyHtml = history.map(h => {
                const hP = parseInt(h[7]) || 0;
                return `
                <div class="flex justify-between items-center py-4 border-b border-slate-100 last:border-0">
                    <div class="text-xs leading-tight">
                        <p class="font-black text-slate-900 text-base mb-1.5 uppercase tracking-tighter">${h[6]} @ ${h[5]}</p>
                        <div class="flex gap-3 text-[11px] text-slate-500 font-bold italic uppercase">
                           <span>BY: ${h[1]}</span>
                           <span>| ${h[0]}</span>
                        </div>
                    </div>
                    <div class="text-2xl font-mono font-black ${hP < 3000 ? 'text-red-500' : 'text-blue-600'} italic leading-none">${hP.toLocaleString()} <span class="text-xs font-sans">PSI</span></div>
                </div>`;
            }).join('');

            document.getElementById('monitor-modal-content').innerHTML = `
                <div class="flex flex-col md:flex-row gap-10">
                    <div class="md:w-[30%] border-b md:border-b-0 md:border-r border-slate-100 pb-8 md:pb-0 md:pr-10">
                        <h2 class="text-5xl lg:text-7xl font-black text-slate-950 italic leading-none mb-8 uppercase tracking-tighter">${item.gas}</h2>
                        <div class="space-y-8">
                            <div class="bg-blue-50/80 p-6 rounded-[2.5rem] border border-blue-100 shadow-inner">
                                <p class="text-xs text-slate-500 font-black uppercase mb-2 tracking-widest leading-none">當前主壓力</p>
                                <div class="flex items-baseline gap-2">
                                    <span class="text-6xl lg:text-7xl font-black text-slate-950 font-mono italic leading-none">${item.pressure.toLocaleString()}</span>
                                    <span class="text-base font-bold text-slate-400 italic">PSI</span>
                                </div>
                            </div>
                            <div class="px-3">
                                <p class="text-xs text-slate-500 font-black uppercase mb-2 tracking-widest leading-none">當前用途</p>
                                <p class="text-blue-800 font-black text-3xl italic leading-none uppercase">${item.reason}</p>
                            </div>
                        </div>
                    </div>
                    <div class="flex-1">
                        <h3 class="text-[13px] font-black text-slate-400 uppercase mb-5 tracking-[0.2em] italic flex items-center gap-3">📜 最近 5 筆歷史異動軌跡</h3>
                        <div class="space-y-1">${historyHtml || '<p class="text-sm text-slate-300">尚無異動數據</p>'}</div>
                    </div>
                </div>
                <button onclick="closeMonitorModal()" class="w-full mt-10 py-5 bg-slate-950 text-white rounded-2xl font-black text-lg tracking-[0.5em] uppercase shadow-xl transition-all active:scale-95">CLOSE DASHBOARD</button>
            `;
            document.getElementById('monitor-modal').classList.remove('hidden'); safeLucide();
        }

        async function loadSchedulesFromCloud() {
            const url = `https://sheets.googleapis.com/v4/spreadsheets/${SPREADSHEET_ID}/values/備刀紀錄!A2:J2000?key=${API_KEY}`;
            try {
                const res = await fetch(url); const data = await res.json();
                if (data.values) {
                    localSchedules = data.values.map(r => ({ id: r[0], date: r[1], weekday: r[2], hospital: r[3], user: r[4], cases: r[5], he: r[6], ar1: r[7], ar2: r[8], status: r[9] }));
                    renderScheduleList();
                }
            } catch (e) { console.error(e); }
        }

        function renderScheduleList() {
            const now = new Date(); now.setHours(0,0,0,0);
            const grid = document.getElementById('scheduleGrid');
            const alertGrid = document.getElementById('alertGrid');
            const historyList = document.getElementById('historyList');

            const alerts = localSchedules.filter(s => new Date(s.date) < now && s.status === 'pending');
            if (alerts.length > 0) {
                document.getElementById('alertSection').classList.remove('hidden');
                alertGrid.innerHTML = alerts.map(i => getItemHtml(i, 'border-l-8 border-amber-500 shadow-amber-50')).join('');
            } else { document.getElementById('alertSection').classList.add('hidden'); }

            const pending = localSchedules.filter(s => new Date(s.date) >= now && s.status === 'pending').sort((a,b) => new Date(a.date) - new Date(b.date));
            grid.innerHTML = pending.map(i => getItemHtml(i, 'hover:border-blue-400 cursor-pointer')).join('') || '<p class="text-base text-slate-300 italic py-16 text-center">目前無待辦任務</p>';

            const history = localSchedules.filter(s => s.status !== 'pending').sort((a,b) => new Date(b.date) - new Date(a.date));
            historyList.innerHTML = history.map(item => `
                <div class="flex justify-between items-center bg-white/70 p-5 rounded-2xl border border-slate-100 opacity-60 grayscale-[0.3]">
                    <div class="flex flex-col">
                        <span class="text-[10px] font-black text-slate-400 uppercase italic line-through mb-1">${item.date}</span>
                        <span class="text-lg font-black text-slate-500 line-through leading-tight">${item.hospital}</span>
                        <span class="text-[10px] text-slate-400 font-bold uppercase mt-1">BY: ${item.user}</span>
                    </div>
                    <div class="flex gap-3">
                        <div class="bg-slate-50 px-3 py-1.5 rounded-xl text-center"><p class="text-[8px] font-bold text-slate-400 leading-none mb-1">HE</p><p class="text-sm font-black text-slate-400 italic">${item.he}</p></div>
                        <div class="bg-slate-50 px-3 py-1.5 rounded-xl text-center"><p class="text-[8px] font-bold text-slate-400 leading-none mb-1">AR1</p><p class="text-sm font-black text-slate-400 italic">${item.ar1}</p></div>
                        <span class="text-[9px] font-black px-2 py-1 h-fit rounded-md ${item.status==='done'?'bg-green-100 text-green-600':'bg-red-100 text-red-600'}">${item.status.toUpperCase()}</span>
                    </div>
                </div>`).join('') || '<p class="text-sm text-slate-400 text-center py-6">尚無近期紀錄</p>';
            safeLucide();
        }

        function getItemHtml(item, customClass) {
            return `<div onclick="editTask('${item.id}')" class="bg-white p-6 rounded-[2.5rem] border border-slate-100 flex justify-between items-center shadow-sm transition-all ${customClass}">
                <div class="flex flex-col">
                    <span class="text-sm font-black text-blue-600 uppercase italic mb-1 tracking-wider leading-none">${item.weekday} ${item.date}</span>
                    <span class="text-xl lg:text-2xl font-black text-slate-900 leading-tight tracking-tight uppercase">${item.hospital}</span>
                    <span class="text-[13px] text-slate-400 font-bold uppercase mt-1">負責人: ${item.user}</span>
                </div>
                <div class="flex gap-3">
                    <div class="bg-blue-50 px-5 py-4 rounded-[1.5rem] text-center shadow-inner"><p class="text-[10px] font-black text-blue-500 leading-none mb-1.5 uppercase">HE</p><p class="text-2xl font-black text-slate-900 italic font-mono leading-none">${item.he}</p></div>
                    <div class="bg-slate-50 px-5 py-4 rounded-[1.5rem] text-center shadow-inner"><p class="text-[10px] font-black text-slate-500 leading-none mb-1.5 uppercase">AR1</p><p class="text-2xl font-black text-slate-900 italic font-mono leading-none">${item.ar1}</p></div>
                </div>
            </div>`;
        }

        // --- 🟢 編輯任務邏輯優化：預填氣體數據修正 ---
        function editTask(id) {
            const item = localSchedules.find(s => s.id.toString() === id.toString()); if (!item) return;
            document.getElementById('editId').value = item.id; 
            document.getElementById('userName').value = item.user; 
            document.getElementById('surgeryDate').value = item.date; 
            document.getElementById('hospitalName').value = item.hospital;
            
            // 🟡 這裡改為帶入純數值，確保與 Select Option 的 Value 匹配
            document.getElementById('heGas').value = item.he; 
            document.getElementById('ar1Gas').value = item.ar1;
            document.getElementById('ar2Gas').value = item.ar2; // 若為"無"也能正確對應

            document.getElementById('weekdayDisplay').innerText = item.weekday;
            document.getElementById('formTitle').innerText = "Edit Sync Task"; 
            document.getElementById('submitBtn').classList.add('hidden'); 
            document.getElementById('editControls').classList.remove('hidden');
            window.scrollTo({top: 0, behavior: 'smooth'});
        }

        async function completeTask() { if(!confirm("確認完工？")) return; const id = document.getElementById('editId').value; const item = localSchedules.find(s => s.id.toString() === id); item.status = 'done'; await saveToCloud(item); renderScheduleList(); resetForm(); }
        async function cancelTask() { if(!confirm("確認取消任務？")) return; const id = document.getElementById('editId').value; const item = localSchedules.find(s => s.id.toString() === id); item.status = 'cancelled'; await saveToCloud(item); renderScheduleList(); resetForm(); }
        function resetForm() { document.getElementById('surgeryForm').reset(); document.getElementById('editId').value = ''; document.getElementById('weekdayDisplay').innerText = '--'; document.getElementById('formTitle').innerText = "Add Task"; document.getElementById('submitBtn').classList.remove('hidden'); document.getElementById('editControls').classList.add('hidden'); }
        function toggleHistory() { document.getElementById('historyList').classList.toggle('hidden'); document.getElementById('historyIcon').style.transform = document.getElementById('historyList').classList.contains('hidden') ? 'rotate(0deg)' : 'rotate(180deg)'; }
        function closeMonitorModal() { document.getElementById('monitor-modal').classList.add('hidden'); }
        function filterRegion(r) { currentMonitorFilter = r; document.querySelectorAll('.reg-btn').forEach(b => b.classList.toggle('bg-blue-600', b.innerText.includes(r))); renderMonitorCards(); }
        async function saveToCloud(p) { try { await fetch(GAS_WEB_APP_URL, { method: "POST", mode: "no-cors", cache: "no-cache", headers: { "Content-Type": "text/plain" }, body: JSON.stringify({ action: "saveSchedule", data: p }) }); alert("✅ 同步指令已發出！"); return true; } catch (e) { return false; } }

        function updateAnalysisRegion(region) {
            document.querySelectorAll('.ana-reg-btn').forEach(btn => btn.className = btn.innerText.includes(region) ? "ana-reg-btn py-5 bg-slate-950 text-white rounded-2xl font-black italic border-2 border-blue-500 shadow-md" : "ana-reg-btn py-5 bg-white text-slate-400 rounded-2xl font-black italic border border-slate-200");
            const hC = {}; let aT=0, aC=0, hT=0, hC_v=0;
            historicalRows.forEach(row => { if (row[3] === region) { if (row[0].includes("2026") && row[5]) hC[row[5]] = (hC[row[5]] || 0) + 1; if (row[6] === "待灌氣") { if (row[2].toLowerCase().startsWith("ar")) { aT += parseInt(row[7]); aC++; } else if (row[2].toLowerCase().startsWith("he")) { hT += parseInt(row[7]); hC_v++; } } } });
            const sH = Object.entries(hC).sort((a,b) => b[1] - a[1]);
            document.getElementById('ana-hospital-list').innerHTML = sH.length > 0 ? sH.map(([n, c]) => `<div class="flex justify-between items-center bg-slate-50 p-5 rounded-2xl border border-slate-200 shadow-sm"><span class="font-black text-slate-800 text-lg">${n}</span><span class="bg-blue-600 text-white px-5 py-1.5 rounded-full text-xs font-black italic tracking-widest">${c} VISITS</span></div>`).join('') : '<p class="text-slate-400 text-center py-16 text-base italic">尚無 2026 年度數據</p>';
            document.getElementById('ana-ar-psi').innerText = aC > 0 ? Math.round(aT/aC) : "--";
            document.getElementById('ana-he-psi').innerText = hC_v > 0 ? Math.round(hT/hC_v) : "--";
        }

        function initForms() {
            const uSel = document.getElementById('userName'); const hSel = document.getElementById('hospitalName'); const gSels = document.querySelectorAll('.gas-sel');
            USERS.forEach(u => uSel.add(new Option(u, u))); HOSPITALS.forEach(h => hSel.add(new Option(h, h)));
            // 🟡 這裡的 Value 是 v (純數字)，所以編輯時也要帶入純數字
            for(let v=6000; v>=2500; v-=100) gSels.forEach(s => s.add(new Option(v+' PSI', v)));
            gSels[2].add(new Option('無', '無'), 0);
            document.getElementById('surgeryDate').addEventListener('input', (e) => { const days=['週日','週一','週二','週三','週四','週五','週六']; document.getElementById('weekdayDisplay').innerText = days[new Date(e.target.value).getDay()] || '--'; });
            document.getElementById('surgeryForm').addEventListener('submit', async function(e) {
                e.preventDefault(); const btn = document.querySelector('#editControls:not(.hidden) button[type="submit"]') || document.getElementById('submitBtn'); btn.disabled = true; btn.innerText = "SYNCING...";
                const data = { id: document.getElementById('editId').value || Date.now().toString(), user: document.getElementById('userName').value, date: document.getElementById('surgeryDate').value, weekday: document.getElementById('weekdayDisplay').innerText, hospital: document.getElementById('hospitalName').value, cases: "1", he: document.getElementById('heGas').value, ar1: document.getElementById('ar1Gas').value, ar2: document.getElementById('ar2Gas').value, status: 'pending' };
                const success = await saveToCloud(data);
                if (success) { const idx = localSchedules.findIndex(s => s.id.toString() === data.id.toString()); if (idx > -1) localSchedules[idx] = data; else localSchedules.push(data); renderScheduleList(); resetForm(); }
                btn.disabled = false; btn.innerText = "Confirm Sync";
            });
        }
    </script>
</body>
</html>

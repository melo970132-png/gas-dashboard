<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GAS 戰情監控中心 v5.3.0</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/lucide/0.263.0/lucide.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Noto+Sans+TC:wght@400;700;900&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet">
    <style>
        :root { --bg-light: #f8fafc; }
        body { font-family: 'Inter', 'Noto Sans TC', sans-serif; background-color: var(--bg-light); color: #1e293b; min-height: 100vh; }
        
        /* ✨ 玻璃美學強化 */
        .glass-card-ar { 
            background: rgba(224, 242, 254, 0.85); 
            backdrop-filter: blur(12px);
            border: 1.5px solid rgba(186, 230, 253, 1);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.05);
        }
        .glass-card-he { 
            background: rgba(245, 243, 255, 0.85); 
            backdrop-filter: blur(12px);
            border: 1.5px solid rgba(221, 214, 254, 1);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.05);
        }
        
        /* 📱 手機版專屬優化：橫向導覽 */
        @media (max-width: 1023px) {
            .mobile-nav-scroll {
                display: flex;
                overflow-x: auto;
                white-space: nowrap;
                padding-bottom: 8px;
                gap: 8px;
            }
            .mobile-nav-scroll::-webkit-scrollbar { display: none; }
            .mobile-nav-btn { flex: 0 0 auto; }
            .main-content { padding: 16px !important; }
            .header-title { font-size: 3rem !important; }
        }

        .nav-active { background: #2563eb !important; color: white !important; box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3); }
        .page-content { display: none; animation: fadeIn 0.4s ease-out forwards; }
        .page-active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.1); border-radius: 10px; }
    </style>
</head>
<body class="flex flex-col lg:flex-row h-screen overflow-hidden">

    <aside class="lg:w-64 w-full bg-white border-b lg:border-r border-slate-200 p-4 lg:p-6 flex flex-col z-50 shadow-sm">
        <div class="mb-4 lg:mb-10 flex flex-row lg:flex-col items-baseline lg:items-start justify-between">
            <h1 class="text-2xl font-black italic tracking-tighter text-slate-900 uppercase">Gas Command</h1>
            <p class="text-[9px] text-blue-600 font-bold tracking-[0.3em] uppercase lg:mt-1 ml-2 lg:ml-0">v5.3.0 Mobile Pro</p>
        </div>
        <nav class="mobile-nav-scroll lg:space-y-2">
            <button onclick="switchPage('monitor')" id="nav-monitor" class="mobile-nav-btn nav-active w-full flex items-center gap-3 px-5 py-3 rounded-xl text-sm font-black transition-all">即時監控</button>
            <button onclick="switchPage('schedule')" id="nav-schedule" class="mobile-nav-btn w-full flex items-center gap-3 px-5 py-3 rounded-xl text-sm font-black text-slate-500 hover:bg-slate-100 transition-all">備刀排程</button>
            <button onclick="switchPage('analysis')" id="nav-analysis" class="mobile-nav-btn w-full flex items-center gap-3 px-5 py-3 rounded-xl text-sm font-black text-slate-500 hover:bg-slate-100 transition-all">數據中心</button>
        </nav>
    </aside>

    <main class="flex-1 overflow-hidden main-content p-10">
        <section id="page-monitor" class="page-content page-active h-full flex flex-col">
            <header class="flex flex-col md:flex-row justify-between items-start md:items-end mb-6 gap-3">
                <div>
                    <h2 class="header-title text-6xl font-black italic text-slate-900 uppercase tracking-tighter leading-none">Live Status</h2>
                    <p class="text-blue-600 text-sm font-bold tracking-widest mt-2 uppercase">各區鋼瓶高密度監控</p>
                </div>
                <div class="flex gap-1 bg-slate-200/50 p-1 rounded-xl border border-slate-200">
                    <button onclick="filterRegion('ALL')" class="reg-btn px-5 py-1.5 rounded-lg text-xs font-bold bg-blue-600 text-white">全域</button>
                    <button onclick="filterRegion('北區')" class="reg-btn px-5 py-1.5 rounded-lg text-xs font-bold text-slate-500">北區</button>
                    <button onclick="filterRegion('中區')" class="reg-btn px-5 py-1.5 rounded-lg text-xs font-bold text-slate-500">中區</button>
                    <button onclick="filterRegion('南區')" class="reg-btn px-5 py-1.5 rounded-lg text-xs font-bold text-slate-500">南區</button>
                </div>
            </header>
            <div id="monitor-grid" class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-6 overflow-y-auto flex-1 custom-scrollbar pb-10"></div>
        </section>

        <section id="page-analysis" class="page-content h-full flex flex-col">
            <header class="mb-6">
                <h2 class="header-title text-6xl font-black italic text-slate-900 uppercase tracking-tighter leading-none">Analytics</h2>
                <p class="text-blue-600 text-sm font-bold tracking-widest mt-2 uppercase">2026 年度數據分析</p>
            </header>
            <div class="grid grid-cols-3 gap-2 mb-6">
                <button onclick="updateAnalysisRegion('北區')" class="ana-reg-btn py-4 bg-slate-800 text-white rounded-2xl font-black italic border-2 border-blue-500 shadow-lg">北區分析</button>
                <button onclick="updateAnalysisRegion('中區')" class="ana-reg-btn py-4 bg-white text-slate-400 rounded-2xl font-black italic border border-slate-200">中區分析</button>
                <button onclick="updateAnalysisRegion('南區')" class="ana-reg-btn py-4 bg-white text-slate-400 rounded-2xl font-black italic border border-slate-200">南區分析</button>
            </div>
            <div class="grid grid-cols-1 lg:grid-cols-2 gap-6 flex-1 overflow-y-auto custom-scrollbar">
                <div class="bg-white p-6 rounded-[2rem] border border-slate-100 shadow-sm">
                    <h3 class="text-xl font-black text-slate-800 mb-4 italic border-b pb-2">📋 勤務頻次統計</h3>
                    <div id="ana-hospital-list" class="space-y-2"></div>
                </div>
                <div class="bg-white p-6 rounded-[2rem] border border-slate-100 shadow-sm flex flex-col justify-center min-h-[300px]">
                    <h3 class="text-xl font-black text-slate-800 mb-8 italic text-center">📉 平均換氣壓力 (PSI)</h3>
                    <div class="flex justify-around items-center">
                        <div class="text-center">
                            <p class="text-xs font-bold text-blue-500 uppercase mb-2">Argon (Ar)</p>
                            <p id="ana-ar-psi" class="text-6xl font-black text-slate-900 font-mono italic">--</p>
                        </div>
                        <div class="w-px h-20 bg-slate-100"></div>
                        <div class="text-center">
                            <p class="text-xs font-bold text-purple-500 uppercase mb-2">Helium (He)</p>
                            <p id="ana-he-psi" class="text-6xl font-black text-slate-900 font-mono italic">--</p>
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <section id="page-schedule" class="page-content h-full">
            <div class="grid grid-cols-1 lg:grid-cols-12 gap-6 h-full">
                <div class="lg:col-span-4 overflow-y-auto custom-scrollbar">
                    <div class="bg-white p-6 rounded-[2rem] border border-slate-200 shadow-sm mb-6">
                        <h3 id="formTitle" class="text-2xl font-black mb-4 text-blue-600 italic">Add Schedule</h3>
                        <form id="surgeryForm" class="space-y-4">
                            <input type="hidden" id="editId">
                            <div><label class="text-xs font-bold text-slate-400 block mb-1 uppercase">負責人</label><select id="userName" required class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-2 text-sm"></select></div>
                            <div class="grid grid-cols-2 gap-2">
                                <div><label class="text-xs font-bold text-slate-400 block mb-1 uppercase">日期</label><input type="date" id="surgeryDate" required class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-2 text-sm"></div>
                                <div><label class="text-xs font-bold text-slate-400 block mb-1 uppercase">星期</label><div id="weekdayDisplay" class="py-2 bg-blue-50 text-blue-600 font-black rounded-xl text-center">--</div></div>
                            </div>
                            <div><label class="text-xs font-bold text-slate-400 block mb-1 uppercase">醫院</label><select id="hospitalName" required class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-2 text-sm"></select></div>
                            <div class="p-4 bg-blue-50 rounded-2xl space-y-3">
                                <div class="grid grid-cols-2 gap-2">
                                    <div><span class="text-[10px] text-blue-500 font-black">HE</span><select id="heGas" class="gas-sel w-full rounded-lg py-1 text-xs"></select></div>
                                    <div><span class="text-[10px] text-blue-500 font-black">AR1</span><select id="ar1Gas" class="gas-sel w-full rounded-lg py-1 text-xs"></select></div>
                                </div>
                            </div>
                            <button type="submit" id="submitBtn" class="w-full py-4 bg-blue-600 rounded-xl font-black text-white text-xs uppercase italic">Confirm Task</button>
                        </form>
                    </div>
                </div>
                <div class="lg:col-span-8 overflow-y-auto custom-scrollbar pb-20">
                    <div id="scheduleGrid" class="space-y-3"></div>
                </div>
            </div>
        </section>
    </main>

    <div id="monitor-modal" class="fixed inset-0 z-[100] hidden flex items-center justify-center p-4 bg-slate-900/40 backdrop-blur-sm">
        <div class="bg-white/95 backdrop-blur-xl w-full max-w-4xl rounded-[2.5rem] p-6 relative border border-white shadow-2xl">
            <button onclick="closeMonitorModal()" class="absolute top-4 right-4 text-slate-400"><i data-lucide="x" class="w-8 h-8"></i></button>
            <div id="monitor-modal-content"></div>
        </div>
    </div>

    <script>
        const SPREADSHEET_ID = '1Vp78y7ACG9wx3RxtAwW-s4YE9l2Ml-hcUjQ2W7QLpXU';
        const API_KEY = 'AIzaSyCQzF6JI8Oa9VsiWq5Qgg56nDX6AtXk_18'; 
        const GAS_WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbyhq3KFBvN-HQzb1eeIx2Bdg_6ZyFJMr4KxJbKajzkSMxMMZNwDHI4koSALFD6wz5d6kA/exec'; 

        const USERS = ["杜孟擇", "張家榮"];
        const HOSPITALS = ["三軍總醫院", "國立臺灣大學醫學院附設醫院", "長庚醫療財團法人林口長庚紀念醫院", "國泰綜合醫院", "醫療財團法人羅許基金會羅東博愛醫院", "新竹臺大分院新竹醫院", "佛教慈濟醫療財團法人台北慈濟醫院", "基隆長庚紀念醫院", "汐止國泰綜合醫院", "新光醫療財團法人新光吳火獅紀念醫院", "佛教慈濟醫療財團法人花蓮慈濟醫院", "臺北榮總醫院", "衛生福利部雙和醫院", "天主教輔仁大學附設醫院", "新竹國泰綜合醫院", "淡水馬偕紀念醫院", "學術會"];
        
        let latestMonitorData = []; 
        let historicalRows = []; 
        let localSchedules = []; 
        let currentMonitorFilter = 'ALL';

        function safeLucide() { if (window.lucide) window.lucide.createIcons(); }

        window.onload = async () => { 
            initForms();
            await fetchMonitorData(); 
            await loadSchedulesFromCloud();
            await preLoadHistoricalData(); 
            updateAnalysisRegion('北區');
            safeLucide(); 
        };

        // --- 核心邏輯 ---
        async function fetchMonitorData() {
            const url = `https://sheets.googleapis.com/v4/spreadsheets/${SPREADSHEET_ID}/values/紀錄!A2:L2000?key=${API_KEY}`;
            try {
                const res = await fetch(url); const data = await res.json();
                if (data.values) {
                    const map = new Map();
                    data.values.forEach(row => {
                        if (row[2]) map.set(row[2], {
                            gas: row[2], region: row[3], standbyDate: row[4], location: row[5], reason: row[6], pressure: parseInt(row[7]) || 0, user: row[1], time: row[0]
                        });
                    });
                    latestMonitorData = Array.from(map.values()).sort((a,b) => a.gas.localeCompare(b.gas));
                    renderMonitorCards();
                }
            } catch (e) { console.error(e); }
        }

        async function preLoadHistoricalData() {
            const url = `https://sheets.googleapis.com/v4/spreadsheets/${SPREADSHEET_ID}/values/紀錄!A2:H3000?key=${API_KEY}`;
            try {
                const response = await fetch(url);
                const result = await response.json();
                historicalRows = result.values || [];
            } catch (e) { console.error(e); }
        }

        function renderMonitorCards() {
            const grid = document.getElementById('monitor-grid');
            const filtered = currentMonitorFilter === 'ALL' ? latestMonitorData : latestMonitorData.filter(d => d.region === currentMonitorFilter);
            grid.innerHTML = filtered.map(item => {
                const isAr = item.gas.toLowerCase().startsWith('ar');
                const glassClass = isAr ? 'glass-card-ar' : 'glass-card-he';
                const isCrit = item.pressure < 3000;
                const pct = Math.min((item.pressure / 6000) * 100, 100);
                return `
                <div onclick="showMonitorDetail('${item.gas}')" class="${glassClass} p-5 rounded-[2.2rem] cursor-pointer active:scale-95 transition-all relative overflow-hidden flex flex-col justify-between h-[320px]">
                    <div class="flex justify-between items-start">
                        <div class="space-y-0.5">
                            <h3 class="text-4xl font-black text-slate-900 italic leading-none">${item.gas}</h3>
                            <p class="text-[13px] font-black text-blue-700 uppercase leading-none mt-1.5">${item.region} · ${item.location}</p>
                        </div>
                        <div class="text-right bg-white/50 px-3 py-2 rounded-2xl border border-white/60">
                            <p class="text-[11px] text-slate-500 font-black uppercase leading-none">用途</p>
                            <p class="text-blue-800 font-black text-xl italic leading-tight">${item.reason}</p>
                            <p class="text-[11px] text-slate-500 font-black uppercase leading-none mt-2">備刀日期</p>
                            <p class="text-slate-800 font-black text-base italic leading-tight">${item.standbyDate || '無'}</p>
                        </div>
                    </div>
                    
                    <div>
                        <div class="flex items-baseline gap-1 leading-none mb-1.5">
                            <span class="text-5xl font-mono font-black text-slate-950 italic">${item.pressure.toLocaleString()}</span>
                            <span class="text-lg font-black text-slate-400 italic">PSI</span>
                        </div>
                        <div class="w-full h-3 bg-white/60 rounded-full overflow-hidden border border-white/40">
                            <div class="h-full ${isCrit ? 'bg-red-500 shadow-[0_0_10px_rgba(239,68,68,0.5)]' : 'bg-blue-600'}" style="width: ${pct}%"></div>
                        </div>
                    </div>

                    <div class="flex justify-between items-end pt-3 border-t border-slate-900/10">
                        <div>
                            <p class="text-[11px] text-slate-500 font-black uppercase leading-none mb-1">人名</p>
                            <p class="text-slate-900 font-black text-lg leading-none">${item.user}</p>
                        </div>
                        <div class="text-right">
                            <p class="text-[11px] text-slate-500 font-black uppercase leading-none mb-1">填入時間</p>
                            <p class="text-slate-700 font-mono font-black text-xs leading-none tracking-tighter">${item.time}</p>
                        </div>
                    </div>
                </div>`;
            }).join('');
            safeLucide();
        }

        function showMonitorDetail(gasName) {
            const item = latestMonitorData.find(d => d.gas === gasName);
            if (!item) return;
            const history = historicalRows.filter(r => r[2] === gasName).slice(-5).reverse();
            let historyHtml = history.map(h => {
                const hP = parseInt(h[7]) || 0;
                return `
                <div class="flex justify-between items-center py-3 border-b border-slate-100 last:border-0">
                    <div class="text-xs leading-tight">
                        <p class="font-black text-slate-800 mb-1">${h[6]} @ ${h[5]}</p>
                        <div class="flex gap-2 text-[10px] text-slate-500 font-black italic">
                           <span>BY: ${h[1]}</span>
                           <span>${h[0]}</span>
                        </div>
                    </div>
                    <div class="text-xl font-mono font-black ${hP < 3000 ? 'text-red-500' : 'text-blue-600'} italic">${hP.toLocaleString()}</div>
                </div>`;
            }).join('');

            document.getElementById('monitor-modal-content').innerHTML = `
                <div class="flex flex-col md:flex-row gap-6">
                    <div class="md:w-[30%] border-b md:border-b-0 md:border-r border-slate-100 pb-4 md:pb-0 md:pr-6">
                        <h2 class="text-5xl font-black text-slate-950 italic leading-none mb-4">${item.gas}</h2>
                        <div class="space-y-4">
                            <div class="bg-blue-50/70 p-4 rounded-2xl border border-blue-100">
                                <p class="text-[11px] text-slate-500 font-black uppercase mb-1">當前存量</p>
                                <p class="text-5xl font-black text-slate-950 font-mono italic leading-none">${item.pressure.toLocaleString()}</p>
                            </div>
                            <div class="px-2">
                                <p class="text-[11px] text-slate-500 font-black uppercase mb-1">目前用途</p>
                                <p class="text-blue-800 font-black text-xl italic leading-none">${item.reason}</p>
                            </div>
                        </div>
                    </div>
                    <div class="flex-1">
                        <h3 class="text-xs font-black text-slate-400 uppercase mb-3 tracking-widest italic flex items-center gap-2">📜 最近 5 筆歷史軌跡</h3>
                        <div class="space-y-1">${historyHtml || '<p class="text-xs text-slate-300">無數據</p>'}</div>
                    </div>
                </div>
                <button onclick="closeMonitorModal()" class="w-full mt-6 py-5 bg-slate-950 text-white rounded-2xl font-black text-sm tracking-[0.4em] uppercase italic">CLOSE</button>
            `;
            document.getElementById('monitor-modal').classList.remove('hidden'); safeLucide();
        }

        // --- 排程與分析功能 ---
        function switchPage(page) {
            document.querySelectorAll('.page-content').forEach(el => el.classList.remove('page-active'));
            document.getElementById('page-' + page).classList.add('page-active');
            document.querySelectorAll('.mobile-nav-btn').forEach(btn => btn.classList.remove('nav-active'));
            const targetNav = (page === 'monitor') ? 'nav-monitor' : (page === 'schedule' ? 'nav-schedule' : 'nav-analysis');
            document.getElementById(targetNav).classList.add('nav-active');
            safeLucide();
        }

        function filterRegion(r) { 
            currentMonitorFilter = r; 
            document.querySelectorAll('.reg-btn').forEach(b => b.classList.toggle('bg-blue-600', b.innerText.includes(r) || (r==='ALL' && b.innerText==='全域')));
            document.querySelectorAll('.reg-btn').forEach(b => b.classList.toggle('text-white', b.classList.contains('bg-blue-600')));
            renderMonitorCards(); 
        }

        function updateAnalysisRegion(region) {
            document.querySelectorAll('.ana-reg-btn').forEach(btn => {
                if(btn.innerText.includes(region)) {
                    btn.className = "ana-reg-btn py-4 bg-slate-800 text-white rounded-2xl font-black italic border-2 border-blue-500 shadow-lg";
                } else {
                    btn.className = "ana-reg-btn py-4 bg-white text-slate-400 rounded-2xl font-black italic border border-slate-200";
                }
            });
            const hospitalCount = {};
            let arTotal = 0, arCount = 0, heTotal = 0, heCount = 0;
            historicalRows.forEach(row => {
                const time = row[0] || "", gasID = row[2] || "", reg = row[3] || "", hospital = row[5] || "", reason = row[6] || "", psi = parseInt(row[7]) || 0;
                if (reg === region) {
                    if (time.includes("2026") && hospital) hospitalCount[hospital] = (hospitalCount[hospital] || 0) + 1;
                    if (reason === "待灌氣") {
                        if (gasID.toLowerCase().startsWith("ar")) { arTotal += psi; arCount++; }
                        else if (gasID.toLowerCase().startsWith("he")) { heTotal += psi; heCount++; }
                    }
                }
            });
            const listArea = document.getElementById('ana-hospital-list');
            const sorted = Object.entries(hospitalCount).sort((a,b) => b[1] - a[1]);
            listArea.innerHTML = sorted.length > 0 ? sorted.map(([name, count]) => `
                <div class="flex justify-between items-center bg-slate-50 p-4 rounded-xl border border-slate-100"><span class="font-bold text-slate-700">${name}</span><span class="bg-blue-600 text-white px-4 py-1 rounded-full text-xs font-black italic">${count} VISITS</span></div>
            `).join('') : '<p class="text-slate-400 text-center py-10">2026 尚無紀錄</p>';
            document.getElementById('ana-ar-psi').innerText = arCount > 0 ? Math.round(arTotal/arCount) : "--";
            document.getElementById('ana-he-psi').innerText = heCount > 0 ? Math.round(heTotal/heCount) : "--";
        }

        async function loadSchedulesFromCloud() {
            const url = `https://sheets.googleapis.com/v4/spreadsheets/${SPREADSHEET_ID}/values/備刀紀錄!A2:J2000?key=${API_KEY}`;
            try { const res = await fetch(url); const data = await res.json(); if (data.values) { localSchedules = data.values.map(r => ({ id: parseInt(r[0]), date: r[1], weekday: r[2], hospital: r[3], user: r[4], cases: r[5], he: r[6], ar1: r[7], ar2: r[8], status: r[9] })); renderScheduleList(); } } catch (e) { console.error(e); }
        }

        function renderScheduleList() {
            const grid = document.getElementById('scheduleGrid'); const now = new Date(); now.setHours(0,0,0,0);
            const sorted = [...localSchedules].sort((a, b) => new Date(a.date) - new Date(b.date));
            const alerts = sorted.filter(s => new Date(s.date) < now && s.status === 'pending');
            const active = sorted.filter(s => new Date(s.date) >= now && s.status === 'pending');
            const archive = sorted.filter(s => (s.status === 'done' || s.status === 'cancelled') && (new Date() - new Date(s.date)) / (1000*60*60*24) <= 7);
            let html = '';
            if(alerts.length > 0) html += `<div class="mb-4"><h4 class="text-xs font-black text-amber-600 uppercase mb-2">⚠️ 逾期未處理</h4>` + alerts.map(i => getItemHtml(i, 'border-l-4 border-amber-500')).join('') + `</div>`;
            html += `<div class="mb-4"><h4 class="text-xs font-black text-slate-400 uppercase mb-2">📅 預定備刀</h4>` + (active.length > 0 ? active.map(i => getItemHtml(i)).join('') : `<p class="text-sm text-slate-300 italic text-center py-4">無任務</p>`) + `</div>`;
            grid.innerHTML = html; safeLucide();
        }

        function getItemHtml(item, customClass = '') {
            return `<div class="bg-white p-4 rounded-2xl border border-slate-100 flex justify-between items-center shadow-sm ${customClass} mb-2">
                <div class="flex flex-col">
                    <span class="text-[10px] font-black text-blue-500 uppercase">${item.weekday} ${item.date.slice(5)}</span>
                    <span class="text-lg font-black text-slate-800">${item.hospital}</span>
                    <span class="text-[10px] text-slate-400 font-bold uppercase">BY: ${item.user}</span>
                </div>
                <div class="flex gap-2">
                    <div class="bg-blue-50 px-3 py-1 rounded-lg text-center"><p class="text-[8px] font-black text-blue-500 leading-none">HE</p><p class="text-sm font-black text-slate-800">${item.he}</p></div>
                    <div class="bg-slate-50 px-3 py-1 rounded-lg text-center"><p class="text-[8px] font-black text-slate-500 leading-none">AR1</p><p class="text-sm font-black text-slate-800">${item.ar1}</p></div>
                </div>
            </div>`;
        }

        function initForms() {
            const uSel = document.getElementById('userName'); const hSel = document.getElementById('hospitalName'); const gSels = document.querySelectorAll('.gas-sel');
            USERS.forEach(u => uSel.add(new Option(u, u))); HOSPITALS.forEach(h => hSel.add(new Option(h, h)));
            for(let v=6000; v>=2500; v-=100) gSels.forEach(s => s.add(new Option(v+' PSI', v)));
            document.getElementById('surgeryDate').addEventListener('input', (e) => { const days = ['週日','週一','週二','週三','週四','週五','週六']; document.getElementById('weekdayDisplay').innerText = days[new Date(e.target.value).getDay()] || '--'; });
        }

        function closeMonitorModal() { document.getElementById('monitor-modal').classList.add('hidden'); }
    </script>
</body>
</html>
